# =============================================================================
# TEST-ONLY logging configuration. NOT a twin of logging/log4j2.properties or
# bot-app/src/main/resources/log4j2.properties -- those two are twins of each
# other (Log4j2TwinConfigTest), and this file is deliberately different from
# both in exactly two respects: where the rolling file of EACH TRACK is written.
#
# WHY IT EXISTS (regression found while implementing LOG_VOLUME_TIERING Phase 1).
# The shipped configuration writes to the container path /app/logs/console.log.
# Before Phase 0 that was harmless off-box: RollingFileAppender simply failed to
# start, log4j2 recorded a status-logger error, and everything else came up. Phase 0
# wrapped that appender in an AsyncAppender -- and AsyncAppender.start() *throws*
# ConfigurationException("No appenders are available for AsyncAppender AsyncRolling")
# when its referenced appender is unavailable. That exception propagates out of
# LoggerContext.start(), so the very first class to touch a logger dies with
# ExceptionInInitializerError. On a build machine where /app cannot be created
# (i.e. any developer Mac, and any CI container not running as root) that meant
# EVERY Spring-context test in the module failed before its first assertion --
# ApplicationContextLoadsTest included, which is the test that exists to catch
# exactly this class of "only breaks outside a unit test" defect.
#
# PHASE 4 ADDS A SECOND SUCH APPENDER. Track 2 (AsyncDetail -> DetailFileAppender,
# /app/logs/detail/detail.log in production) has exactly the same property: an
# AsyncAppender whose target cannot start takes the whole build down in the same
# way. So it is redeclared here against target/test-logs/detail/ for the same
# reason, and forgetting to do that is the single failure this header exists to
# prevent -- it looks like a Spring problem and is not.
#
# Log4j2 prefers log4j2-test.properties over log4j2.properties on the test
# classpath, and it is also one of Spring Boot's standard Log4J2LoggingSystem
# config locations, so this file fixes the build without touching either shipped
# copy and without a surefire system property.
#
# KEEP THE LOGGER SHAPE IDENTICAL to the shipped files: same logger names, same
# additivity, same three appender NAMES (ConsoleAppender / AsyncRolling /
# AsyncDetail). AD-7's guarantee -- that Spring Boot's `logging.level.*` mutates
# the existing com.vingame.bot LoggerConfig in place and preserves additivity plus
# every appenderRef -- is verified against this shape by LoggingLevelOverrideTest.
# If the shape here drifts from production, that test starts proving nothing.
# Log4j2TestConfigShapeTest enumerates the keys that must match.
# =============================================================================

# Root logger configuration
rootLogger.level = info
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.async.ref = AsyncRolling
rootLogger.appenderRef.detail.ref = AsyncDetail

# Logger for application package. Level is deliberately `info` -- the same shipped
# default as production (AD-7). Individual tests raise it via
# @SpringBootTest(properties = "logging.level.com.vingame.bot=DEBUG").
logger.app.name = com.vingame.bot
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRef.console.ref = ConsoleAppender
logger.app.appenderRef.async.ref = AsyncRolling
logger.app.appenderRef.detail.ref = AsyncDetail

# The WebSocket Parser library (AD-23), pulled out of the root logger with
# additivity = false and routed to track 2 alone. Redeclared here with the exact
# production spelling so a rename in the shipped files is caught by
# Log4j2TestConfigShapeTest rather than by 98.7% of INFO volume reappearing in
# Loki on the box.
logger.wsparser.name = com.vingame.websocketparser
logger.wsparser.level = info
logger.wsparser.additivity = false
logger.wsparser.appenderRef.detail.ref = AsyncDetail

# Console appender. No ThresholdFilter here, unlike production (AD-5): a test run
# that is being debugged wants to see the DEBUG lines it deliberately enabled, and
# the console double-write cost this filter exists to halve is a fleet-scale
# concern that does not apply to a build.
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %c{1} [%X{botGroupId}/%X{botId}/%X{gameType}] - %msg%n

# TRACK 1. Rolling file appender. THE FIRST INTENTIONAL DIFFERENCE from the
# shipped files: target/ instead of /app/logs, so the appender actually starts and
# `mvn clean` takes the output with it. Same JSON layout, so a test may assert on
# the emitted document shape if it ever needs to.
appender.rolling.type = RollingFile
appender.rolling.name = RollingFileAppender
appender.rolling.fileName = target/test-logs/console.log
appender.rolling.filePattern = target/test-logs/console-%d{yyyy-MM-dd-HH}.log
appender.rolling.layout.type = JsonTemplateLayout
appender.rolling.layout.eventTemplateUri = classpath:log4j2-json-template.json

# Async wrapper, kept so the appenderRef name the production config uses
# (AsyncRolling) is the name tests assert on. The ThresholdFilter is production's
# (AD-24) -- it is what keeps DEBUG out of Loki, so the build exercises the same
# spelling. It does not hide anything from a developer: the console above has no
# filter at all.
appender.async.type = Async
appender.async.name = AsyncRolling
appender.async.appenderRef.type = AppenderRef
appender.async.appenderRef.ref = RollingFileAppender
appender.async.bufferSize = 1024
appender.async.blocking = true
appender.async.filter.threshold.type = ThresholdFilter
appender.async.filter.threshold.level = info
appender.async.filter.threshold.onMatch = NEUTRAL
appender.async.filter.threshold.onMismatch = DENY

appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 2
appender.rolling.policies.time.modulate = true

# Small, aggressive retention: a build must not accumulate logs across runs.
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 2

# TRACK 2. THE SECOND INTENTIONAL DIFFERENCE: target/test-logs/detail/ instead of
# /app/logs/detail/, for exactly the reason in the header. Everything else about
# the graph -- the appender names, the PatternLayout, the rollover interval and
# the blocking = false that is deliberately the opposite of AsyncRolling's -- is
# production's, because that is the shape the build is meant to be exercising.
appender.detail.type = RollingFile
appender.detail.name = DetailFileAppender
appender.detail.fileName = target/test-logs/detail/detail.log
appender.detail.filePattern = target/test-logs/detail/detail-%d{yyyy-MM-dd-HH}.log
appender.detail.immediateFlush = false
appender.detail.layout.type = PatternLayout
appender.detail.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSS}{UTC} %-5level %c %t [%X{botGroupId}/%X{botId}/%X{gameType}] - %msg%n
appender.detail.policies.type = Policies
appender.detail.policies.time.type = TimeBasedTriggeringPolicy
appender.detail.policies.time.interval = 2
appender.detail.policies.time.modulate = true

# As for track 1: retention is the documented reason this file differs, so the
# shipped Delete (12 h OR 10 GB under /app/logs/detail) is replaced by the same
# small `max` a build wants. Nothing here may name /app.
appender.detail.strategy.type = DefaultRolloverStrategy
appender.detail.strategy.max = 2

# blocking = false is PRODUCTION'S setting and is deliberately the opposite of
# AsyncRolling's `true` above -- see AD-25(4) and the long comment in
# logging/log4j2.properties. It is asserted as a pair by AsyncQueuePolicyTest and
# pinned here by Log4j2TestConfigShapeTest so the two files cannot drift apart on
# the one setting most likely to be "fixed" by a well-meaning reader.
appender.asyncdetail.type = Async
appender.asyncdetail.name = AsyncDetail
appender.asyncdetail.appenderRef.type = AppenderRef
appender.asyncdetail.appenderRef.ref = DetailFileAppender
appender.asyncdetail.bufferSize = 1024
appender.asyncdetail.blocking = false
