# =============================================================================
# TEST-ONLY logging configuration. NOT a twin of logging/log4j2.properties or
# bot-app/src/main/resources/log4j2.properties -- those two are twins of each
# other (Log4j2TwinConfigTest), and this file is deliberately different from
# both in exactly one respect: where the rolling file is written.
#
# WHY IT EXISTS (regression found while implementing LOG_VOLUME_TIERING Phase 1).
# The shipped configuration writes to the container path /app/logs/console.log.
# Before Phase 0 that was harmless off-box: RollingFileAppender simply failed to
# start, log4j2 recorded a status-logger error, and everything else came up. Phase 0
# wrapped that appender in an AsyncAppender -- and AsyncAppender.start() *throws*
# ConfigurationException("No appenders are available for AsyncAppender AsyncRolling")
# when its referenced appender is unavailable. That exception propagates out of
# LoggerContext.start(), so the very first class to touch a logger dies with
# ExceptionInInitializerError. On a build machine where /app cannot be created
# (i.e. any developer Mac, and any CI container not running as root) that meant
# EVERY Spring-context test in the module failed before its first assertion --
# ApplicationContextLoadsTest included, which is the test that exists to catch
# exactly this class of "only breaks outside a unit test" defect.
#
# Log4j2 prefers log4j2-test.properties over log4j2.properties on the test
# classpath, and it is also one of Spring Boot's standard Log4J2LoggingSystem
# config locations, so this file fixes the build without touching either shipped
# copy and without a surefire system property.
#
# KEEP THE LOGGER SHAPE IDENTICAL to the shipped files: same logger name, same
# additivity, same two appender NAMES (ConsoleAppender / AsyncRolling). AD-7's
# guarantee -- that Spring Boot's `logging.level.*` mutates the existing
# com.vingame.bot LoggerConfig in place and preserves additivity plus both
# appenderRefs -- is verified against this shape by LoggingLevelOverrideTest. If
# the shape here drifts from production, that test starts proving nothing.
# =============================================================================

# Root logger configuration
rootLogger.level = info
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.async.ref = AsyncRolling

# Logger for application package. Level is deliberately `info` -- the same shipped
# default as production (AD-7). Individual tests raise it via
# @SpringBootTest(properties = "logging.level.com.vingame.bot=DEBUG").
logger.app.name = com.vingame.bot
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRef.console.ref = ConsoleAppender
logger.app.appenderRef.async.ref = AsyncRolling

# Console appender. No ThresholdFilter here, unlike production (AD-5): a test run
# that is being debugged wants to see the DEBUG lines it deliberately enabled, and
# the console double-write cost this filter exists to halve is a fleet-scale
# concern that does not apply to a build.
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %c{1} [%X{botGroupId}/%X{botId}/%X{gameType}] - %msg%n

# Rolling file appender. THE ONE INTENTIONAL DIFFERENCE from the shipped files:
# target/ instead of /app/logs, so the appender actually starts and `mvn clean`
# takes the output with it. Same JSON layout, so a test may assert on the emitted
# document shape if it ever needs to.
appender.rolling.type = RollingFile
appender.rolling.name = RollingFileAppender
appender.rolling.fileName = target/test-logs/console.log
appender.rolling.filePattern = target/test-logs/console-%d{yyyy-MM-dd-HH}.log
appender.rolling.layout.type = JsonTemplateLayout
appender.rolling.layout.eventTemplateUri = classpath:log4j2-json-template.json

# Async wrapper, kept so the appenderRef name the production config uses
# (AsyncRolling) is the name tests assert on.
appender.async.type = Async
appender.async.name = AsyncRolling
appender.async.appenderRef.type = AppenderRef
appender.async.appenderRef.ref = RollingFileAppender
appender.async.bufferSize = 1024
appender.async.blocking = true

appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 2
appender.rolling.policies.time.modulate = true

# Small, aggressive retention: a build must not accumulate logs across runs.
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 2
