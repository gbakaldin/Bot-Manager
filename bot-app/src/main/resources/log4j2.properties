# =============================================================================
# IN-JAR COPY. Its twin is /logging/log4j2.properties in the repo root, which is
# bind-mounted at /app/config/log4j2.properties and selected by LOGGING_CONFIG
# (docker-compose.yml, LOG_VOLUME_TIERING AD-2). KEEP THE TWO IN SYNC — every
# change below must be applied to both files.
#
# Why both exist: the mounted copy is what makes a level/retention change a
# `docker compose restart` instead of a rebuild + redeploy of the whole fleet.
# This copy is the fallback for tests, local runs and any host without the
# mount. Do NOT delete it: log4j2 with no configuration at all falls back to
# DefaultConfiguration (ERROR to console only), which looks exactly like "the
# app went quiet".
#
# TWO TRACKS (LOG_VOLUME_TIERING Phase 4, AD-22 .. AD-27): track 1 is
# /app/logs/console.log (JSON, INFO+ only, the ONLY thing promtail ships to
# Loki) and track 2 is /app/logs/detail/detail.log (PatternLayout, the ws-parser
# library in full plus all our DEBUG/TRACE, never in Loki, read on the box).
# Both roll on the same 2 h modulated boundary -- the evidence shim's single tail
# pass depends on that. The long-form reasoning lives in the mounted twin's
# header and in the inline comments below, which are identical in both files.
# =============================================================================

# Root logger configuration. Root stays wired to the console and to track 1
# deliberately (AD-27): losing Spring's `Started Starter in 9.267 seconds` would
# break the releaser's smoke test, and losing third-party ERROR would blind
# operators to 5xx and driver failures -- tens of lines per JVM lifetime, not a
# volume problem. Root is ALSO wired to track 2 so the detail file is
# self-contained and readable without cross-referencing console.log.
rootLogger.level = info
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.async.ref = AsyncRolling
rootLogger.appenderRef.detail.ref = AsyncDetail

# Logger for application package.
#
# The shipped default is INFO (LOG_VOLUME_TIERING Phase 1, AD-7). DEBUG here was
# baked into the jar and projected to 46-124 GB/day at 20-30k bots; INFO is now
# the cheap, correct floor and per-bot detail is opt-in.
#
# Override WITHOUT editing this file: set LOGGING_LEVEL_COM_VINGAME_BOT (compose
# passes ${BOT_LOG_LEVEL:-INFO}). Spring Boot's Log4J2LoggingSystem applies
# `logging.level.*` AFTER this file is read and, because a LoggerConfig named
# exactly `com.vingame.bot` exists below, it mutates that config in place --
# additivity = false and ALL THREE appenderRefs survive. Verified in the build by
# LoggingLevelOverrideTest; do not rename this logger or that override silently
# starts creating a fresh LoggerConfig with no appenders instead.
#
# Staging sets BOT_LOG_LEVEL=DEBUG in secrets.env/.env. /actuator/loggers still
# works and is still GLOBAL -- at 10 prod environments that is a ~5 GB/hour action.
# Its DEBUG lands in track 2 only: the ThresholdFilter on AsyncRolling keeps
# console.log (and therefore Loki) at INFO+ whatever this level says.
logger.app.name = com.vingame.bot
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRef.console.ref = ConsoleAppender
logger.app.appenderRef.async.ref = AsyncRolling
logger.app.appenderRef.detail.ref = AsyncDetail

# The WebSocket Parser library (AD-23). This block IS the fix for Phase 4's
# Finding 1: with additivity = false the library stops inheriting the root
# logger's appenders, so its measured 14.67 lines/s never reach the console,
# never reach console.log and therefore never reach Loki. They land in track 2
# and nowhere else.
#
# DO NOT RENAME `com.vingame.websocketparser`. It is the library's single, exact
# package root (verified against websocket-parser-core 3.0.5: one root package,
# twelve subpackages). Spring Boot's setLogLevel mutates a LoggerConfig that
# exists BY EXACT NAME in place; against a name that does not exist it creates a
# fresh one with NO appenders, which would silently delete the detail track.
#
# The level stays `info` (AD-32) -- that is what every projection in AD-26 is
# built on. It is overridable without editing this file via
# LOGGING_LEVEL_COM_VINGAME_WEBSOCKETPARSER (compose passes
# ${WSPARSER_LOG_LEVEL:-INFO}); WARN removes ~99% of track 2's volume and is the
# disk escape hatch on a box that needs one before a ramp.
logger.wsparser.name = com.vingame.websocketparser
logger.wsparser.level = info
logger.wsparser.additivity = false
logger.wsparser.appenderRef.detail.ref = AsyncDetail

# Console appender - human-readable with MDC context
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %c{1} [%X{botGroupId}/%X{botId}/%X{gameType}] - %msg%n
# Cap the console at INFO+ (AD-5). Every line used to be serialized and written
# twice: once as a pattern line to stdout (-> docker json-file, capped 50m x 5)
# and once as JSON to the rolling file. `docker logs` stays useful (INFO and all
# WARN/ERROR still appear) while DEBUG/TRACE go to the JSON file only, halving
# the cost of exactly the tier we are trying to make survivable.
# Since Phase 4 the console also no longer sees com.vingame.websocketparser at
# all (AD-23/AD-27), so `docker logs bot-manager` loses the AUTH [...] flood some
# operators used as a liveness signal -- the replacement is the ws-parser
# narrative in logs/detail/detail.log and bot_messages_total in Prometheus.
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = info
appender.console.filter.threshold.onMatch = NEUTRAL
appender.console.filter.threshold.onMismatch = DENY

# ---------------------------------------------------------------------------
# TRACK 1 (main): the only track promtail ships to Loki.
# ---------------------------------------------------------------------------

# Rolling file appender - JSON structured for Promtail/Loki
appender.rolling.type = RollingFile
appender.rolling.name = RollingFileAppender
appender.rolling.fileName = /app/logs/console.log
appender.rolling.filePattern = /app/logs/console-%d{yyyy-MM-dd-HH}.log
appender.rolling.layout.type = JsonTemplateLayout
appender.rolling.layout.eventTemplateUri = classpath:log4j2-json-template.json

# Async wrapper for the rolling file appender (AD-3). Both appends used to happen
# on the calling bot thread; logging must never add latency to a bot thread.
# AsyncAppender is stdlib log4j-core -- full async loggers would need
# com.lmax:disruptor, which is not on the classpath and would make this a pom
# change rather than a config change.
#
# GOTCHA: in the properties format a nested AppenderRef *inside an appender*
# requires the explicit `.type = AppenderRef` line below (unlike a logger's
# appenderRef). On log4j-core 2.24.1 omitting it throws
# "ConfigurationException: No type attribute provided for component appenderRef"
# at context start, i.e. the JVM never gets a logger — verified, not theoretical.
appender.async.type = Async
appender.async.name = AsyncRolling
appender.async.appenderRef.type = AppenderRef
appender.async.appenderRef.ref = RollingFileAppender
appender.async.bufferSize = 8192
# blocking = true is REQUIRED for the discard policy in log4j2.component.properties
# to take effect, and therefore for AD-4 to hold. AsyncAppender.append() only
# consults asyncQueueFullPolicy when blocking is true; with blocking = false it
# drops the event at EVERY level (ERROR included) and just writes to the status
# logger. With blocking = true + Discard/discardThreshold=DEBUG, a full queue
# discards DEBUG/TRACE and blocks only for INFO+, which is the stated intent.
# See LOG_VOLUME_TIERING AD-4 (the AD-3 snippet's `blocking = false` contradicts it).
# NOTE the deliberate asymmetry with AsyncDetail below, which is `false`: read the
# comment there before "fixing" either of them.
appender.async.blocking = true
# Track 1 is capped at INFO+ (AD-24). This single filter is what keeps DEBUG and
# TRACE out of Loki by EVERY path -- including Phase 2's scoped-debug ACCEPT,
# which bypasses the LEVEL check but not an appender's own filter
# (AppenderControl.callAppender0 calls appender.isFiltered() before append()).
# Measured on the box: with BOT_LOG_LEVEL=DEBUG and two scoped escalations live,
# the console carried 0 DEBUG lines while the JSON file carried 14,310.
#
# It sits on the ASYNC WRAPPER, not on RollingFileAppender: here a DEBUG event is
# rejected before it consumes a slot in the 8,192-entry queue; on the inner
# appender it would be queued, dispatched to the async thread, and only then
# discarded. At staging's ~16 DEBUG lines/s that is the difference between a
# filter and a treadmill.
#
# The drill-in that used to live in Grafana now lives in track 2 on the box; the
# scoped-debug arming/escalation lines are com.vingame.bot INFO, so the POINTER
# stays in Loki. To put com.vingame.bot DEBUG back into Loki at the AD-24 cost
# already worked out (~100 MB/day observed, 1.9 GB/day worst case): change `info`
# to `debug` here and set BOT_LOG_LEVEL=INFO on staging.
appender.async.filter.threshold.type = ThresholdFilter
appender.async.filter.threshold.level = info
appender.async.filter.threshold.onMatch = NEUTRAL
appender.async.filter.threshold.onMismatch = DENY

# Trigger rollover every 2 hours (AD-20, reaffirmed by AD-22). Fewer boundaries,
# and a longer window of pre-incident context for Phase 3's "newest two"
# promotion. modulate = true keeps boundaries on even hours, so
# %d{yyyy-MM-dd-HH} names stay unique. Track 2's interval below MUST match:
# one boundary for both tracks is what lets the evidence shim's single tail pass
# close both live files (EvidenceRetentionEscapeTest asserts the equality).
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 2
appender.rolling.policies.time.modulate = true

# Delete files older than 14 days OR if total size > 10GB.
# Phase 0 step 5 deferred the 7d -> 14d raise "only after P0-6 establishes the
# disk size"; P0-6 has now run (Bot-1: 100 GiB total, 66.96 GiB free) and 14 d
# aligns track 1 with logs/evidence/'s aggregate age (AD-26). Track 1 is INFO-only
# since Phase 4, so realistically it never approaches 10 GB -- the cap stays as
# the backstop that was standing between us and a repeat of 2026-06-30.
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 200
appender.rolling.strategy.delete.type = Delete
appender.rolling.strategy.delete.basePath = /app/logs
appender.rolling.strategy.delete.maxDepth = 1
appender.rolling.strategy.delete.ifFileName.type = IfFileName
appender.rolling.strategy.delete.ifFileName.glob = console-*.log
appender.rolling.strategy.delete.ifAny.type = IfAny
appender.rolling.strategy.delete.ifAny.ifLastModified.type = IfLastModified
appender.rolling.strategy.delete.ifAny.ifLastModified.age = 14d
appender.rolling.strategy.delete.ifAny.ifAccumulatedFileSize.type = IfAccumulatedFileSize
appender.rolling.strategy.delete.ifAny.ifAccumulatedFileSize.exceeds = 10GB

# ---------------------------------------------------------------------------
# TRACK 2 (detail): ws-parser in full + all our DEBUG/TRACE. Never in Loki.
# ---------------------------------------------------------------------------

# A SUBDIRECTORY, and that is three independent guards in one (AD-25(1)):
#   * promtail's `__path__: /logs/*.log` is non-recursive, so nothing under
#     logs/detail/ is ever ingested -- the same escape logs/evidence/ already
#     uses and which was verified live on the box;
#   * track 1's Delete is anchored at /app/logs with maxDepth = 1 and a
#     `console-*.log` glob, so it cannot reach in here;
#   * this Delete is anchored at /app/logs/detail with maxDepth = 1 and a
#     `detail-*.log` glob, so it cannot reach out to logs/ or logs/evidence/.
# log4j2's FileManager creates the parent directory itself; `mkdir -p logs/detail`
# on the box before `docker compose up` removes the whole class of risk anyway,
# because an AsyncAppender whose target cannot start throws at context start.
#
# PatternLayout, not JsonTemplateLayout (AD-25(2)): nothing parses track 2 --
# not promtail, not Loki, not Grafana. JSON costs ~400 B/line against ~250 B for
# a pattern line, so the layout choice alone removes ~38% of track 2's bytes. It
# also sidesteps the ws-parser ANSI-escape defect: ESC[36m inside a plain-text
# line is harmless (it renders as colour under `less -R`), whereas inside a JSON
# `message` field it is corruption. %c keeps the FULL logger name so a misroute is
# greppable. The MDC renders as [botGroupId/botId/gameType], NOT as JSON fields --
# a drill-in grep here is `grep "\[<GROUP_ID>/"`, not `"botGroupId":"<GID>"`.
#
# immediateFlush = false (AD-25(3)): the standard async recipe. log4j2 flushes at
# endOfBatch, i.e. whenever the async queue drains, so at steady state the file is
# current within milliseconds and the per-event flush syscall is gone. Rollover
# closes and flushes the file, so a promoted archive is always complete.
#
# THE EXPOSURE IS THE LAST <= 8 KB, NOT "THE LAST FEW MS". bufferSize below is
# declared rather than inherited precisely so that bound is a decision: on an
# unclean kill the un-flushed tail of the buffer is lost, and how much TIME that
# is depends inversely on the log rate --
#   20k bots, healthy (~1,893 lines/s)   ~17 ms   genuinely nothing
#   staging, 155 bots (~14.7 lines/s)    ~2.2 s
#   a JVM in a death spiral, log rate collapsing   MINUTES
# The third row is the one that matters, and it interacts with AD-21: an unclean
# kill is exactly what the evidence shim's boot retro-promotion triggers on, so
# the shim can pin a file whose final 8 KB -- the quietest, most diagnostic part,
# written while the box was dying -- never reached the disk. That is the trade
# being made for a best-effort forensic tier; track 1 keeps immediateFlush = true
# so the INFO+ timeline has no such gap.
appender.detail.type = RollingFile
appender.detail.name = DetailFileAppender
appender.detail.fileName = /app/logs/detail/detail.log
appender.detail.filePattern = /app/logs/detail/detail-%d{yyyy-MM-dd-HH}.log
appender.detail.immediateFlush = false
appender.detail.bufferSize = 8192
appender.detail.layout.type = PatternLayout
appender.detail.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSS}{UTC} %-5level %c %t [%X{botGroupId}/%X{botId}/%X{gameType}] - %msg%n
appender.detail.policies.type = Policies
appender.detail.policies.time.type = TimeBasedTriggeringPolicy
appender.detail.policies.time.interval = 2
appender.detail.policies.time.modulate = true

# 12 hours OR 10 GB accumulated, whichever binds first (AD-26, as corrected by
# plan Amendment B1 -- the original 0.0947 lines/s/bot divided an 11-minute count
# by 300 s and was 2.2x too high). At the corrected 0.0429 ws-parser INFO
# lines/s/bot and ~250 B/line the AGE binds up to ~20,000 bots (the full 12 h);
# above that the byte cap binds, giving ~8.6 h of coverage at 30k. The property
# being bought is "at least ~8.6 h of full detail at any scale up to 30k bots,
# for at most 10 GB of archives".
#
# NOTE ifAccumulatedFileSize counts the ARCHIVES only -- the glob excludes the
# live detail.log, which adds up to one more 2 h file on top before it rolls
# (~1.2 GB at 20k bots, ~2.3 GB at 30k on the corrected rate). So budget ~12.3 GB
# for this track at 30k, not 10. Reconciled whole-disk ceiling, which is the
# figure that actually matters: track 1 10 GB (INFO-only, so realistically
# < 250 MB) + track 2 ~12.3 GB + evidence 12 GB = ~34 GB nominal, ~51% of the
# 66.96 GiB free measured on Bot-1 -- above the 50%-of-free-disk line this feature
# applies to Loki. Evidence entries are hardlinks of these same inodes, so the
# real peak is materially below the sum. Verification P4-6 is the gate: before
# ramping past ~5,000 bots on one box, or on any box with under 100 GB of disk,
# re-measure and cut a cap (or set WSPARSER_LOG_LEVEL=WARN) so the reconciled
# ceiling stays under half of measured free disk.
appender.detail.strategy.type = DefaultRolloverStrategy
appender.detail.strategy.max = 200
appender.detail.strategy.delete.type = Delete
appender.detail.strategy.delete.basePath = /app/logs/detail
appender.detail.strategy.delete.maxDepth = 1
appender.detail.strategy.delete.ifFileName.type = IfFileName
appender.detail.strategy.delete.ifFileName.glob = detail-*.log
appender.detail.strategy.delete.ifAny.type = IfAny
appender.detail.strategy.delete.ifAny.ifLastModified.type = IfLastModified
appender.detail.strategy.delete.ifAny.ifLastModified.age = 12h
appender.detail.strategy.delete.ifAny.ifAccumulatedFileSize.type = IfAccumulatedFileSize
appender.detail.strategy.delete.ifAny.ifAccumulatedFileSize.exceeds = 10GB

# Async wrapper for track 2. The `.type = AppenderRef` line is the same trap
# flagged for AsyncRolling above -- omitting it throws ConfigurationException at
# context start and the JVM never gets a logger. Same trap, second appender.
#
# bufferSize 16384 (track 1's is 8192 -- these are NOT the same number) was sized
# as ~8.6 s of backlog at a projected 1,893 lines/s at 20k bots; on the corrected
# rate (plan Amendment B1) that same buffer is ~19 s, i.e. the sizing errs long,
# which is the safe direction for absorbing a GC pause or a rollover stall.
# includeLocation stays at its default false: location capture at these rates
# would be ruinous.
appender.asyncdetail.type = Async
appender.asyncdetail.name = AsyncDetail
appender.asyncdetail.appenderRef.type = AppenderRef
appender.asyncdetail.appenderRef.ref = DetailFileAppender
appender.asyncdetail.bufferSize = 16384
# ####################################################################### #
# blocking = false HERE IS DELIBERATE AND IS THE OPPOSITE OF AsyncRolling. #
# ####################################################################### #
# It looks exactly like the AD-3/AD-4 defect an earlier pass fixed on track 1.
# It is not. Read this before changing it (AD-25(4)):
#
#   * log4j2.discardThreshold = DEBUG in log4j2.component.properties is a
#     JVM-WIDE property. It cannot discard track 2's INFO without also discarding
#     track 1's, so AD-4's policy simply cannot express what track 2 needs.
#   * Track 2 now carries the highest-volume tier in the system -- ~1,893 lines/s
#     at 20k bots -- at INFO. Under blocking = true a full detail queue would park
#     a BOT THREAD on a queue wait: precisely the latency AD-4 exists to prevent,
#     reintroduced through the back door.
#   * Track 2 is a best-effort forensic tier. Dropping an event at any level when
#     the queue is full is exactly right for it.
#
# Track 1 keeps blocking = true so its INFO+ signal -- the tier Alertmanager and
# Loki are wired to -- is never lost. The two settings are a deliberate PAIR;
# AsyncQueuePolicyTest asserts both, with this reasoning in its failure message.
#
# THE DROP IS COUNTED. log4j2 reports it only via DefaultErrorHandler -- three
# messages, then one per 5 min, uncounted, on stderr -- which reaches neither
# console.log nor Loki nor this file. AsyncQueueMetrics publishes
# log4j2_async_queue_remaining / _capacity / _pressure_samples_total /
# _full_samples_total per appender and WARNs (throttled, with running totals) on
# track 1, and the LogQueueSaturated rule in prometheus/alerts.yml alerts on it.
# If those go away, this line silently becomes lossy again.
appender.asyncdetail.blocking = false
