# log4j2 global properties (LOG_VOLUME_TIERING AD-4).
#
# These are read by log4j2's PropertiesUtil from the classpath, NOT from the
# configuration file, so they live here and not in log4j2.properties. They are
# therefore in-jar only: unlike log4j2.properties there is no bind-mounted twin,
# and changing them needs a rebuild. Equivalent overrides can be passed as
# -Dlog4j2.asyncQueueFullPolicy=... via JAVA_TOOL_OPTIONS if it ever has to be
# changed on a box in anger.
#
# Behaviour when the AsyncAppender queue (bufferSize = 8192) fills up:
#   - DEBUG and TRACE events are DISCARDED (discardThreshold = DEBUG means "at
#     or below DEBUG"); logging must never add latency to a bot thread, and if
#     the choice is "block a bot" or "lose a DEBUG line", lose the line.
#   - INFO, WARN and ERROR are never discarded -- the calling thread blocks
#     until the queue drains. WARN/ERROR are invisibly coupled to alerting.
#
# This only works because appender.async.blocking = true in log4j2.properties;
# with blocking = false AsyncAppender never consults this policy and drops
# events at every level instead.
log4j2.asyncQueueFullPolicy = Discard
log4j2.discardThreshold = DEBUG
