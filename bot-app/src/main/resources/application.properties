# src/main/resources/application.properties

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/botmanager

server.port=8085

# Change the path for Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Change the path for OpenAPI docs
springdoc.api-docs.path=/v3/api-docs

# Set a custom server URL (optional)
springdoc.api-docs.server.url=http://localhost:8085

# Netty EventLoopGroup Configuration
# Number of threads for WebSocket event loop
# Production (few hundred bots): 2-4 threads
# Load testing (hundreds of thousands): 16-32 threads or higher
websocket.eventloop.threads=4

# Game Microservice Configuration
# Global URL for game microservice (used by GameMsClient for deposits)
gamems.url=http://gamems.dev:5007

# Prometheus Configuration
# Base URL bot-manager uses to query Prometheus for the metrics API
# (PrometheusQueryClient). Compose service name on the internal network.
# Internal-only — never exposed to the UI.
prometheus.url=http://prometheus:9090

# Metrics API caching (METRICS_API AD-8). Short server-side TTL on Prometheus
# query results so polling UI clients don't amplify load onto Prometheus.
# Dependency-free in-process cache; 0 disables caching.
metrics.cache.ttl-seconds=5

# Metrics API rate limit (METRICS_API AD-9). Per-client (per-IP) token-bucket
# guard on /api/v1/metrics/** — these are public+unauthenticated and hit
# Prometheus, so cap the request rate. Exceeding the limit returns HTTP 429.
metrics.ratelimit.requests-per-minute=120

# RTP window substitution (METRICS_IMPROVEMENT AD-6). RTP templates store the
# Grafana-only $__range token; MetricsQueryService swaps it for these concrete
# windows before dispatch (the token must never reach Prometheus).
# summary-window: instant query window for the headline long-term RTP (= retention).
metrics.rtp.summary-window=30d
# timeseries-window: per-point sliding window for the RTP chart.
metrics.rtp.timeseries-window=1h

# VipTalk Alerting (VIPTALK_ALERTING)
# Outbound alerts / announcements into the VipTalk messenger, routed per product.
# Room IDs are NOT configured here — they live on ProductCode (AD-1), one per product.
# Disabled by default: with no bot token there is nothing to send to, and an enabled
# channel with a blank token self-disables with an ERROR rather than failing startup (AD-3).
viptalk.enabled=false
viptalk.base-url=https://api.viptalk.org
# Bot token. NEVER commit a real token — set VIPTALK_BOT_TOKEN in the environment (AD-2).
viptalk.bot-token=
# Room for `audience: internal` alerts — fundamental infrastructure only (host CPU / RAM /
# storage, app down or restarted). It also receives, tagged as misrouted, any product-scoped
# alert whose product has no room wired yet (VIPTALK_ALERTING_V2 AD-V5). Blank = such
# messages are dropped with a WARN instead of being delivered.
viptalk.ops-room-id=
# Customer-facing copy for `audience: both` alerts, delivered to the product room in a
# non-technical register (AD-V7). PROD ONLY — with this on, every staging restart would
# announce "the application is experiencing issues" in a live product room.
viptalk.customer-notices-enabled=false
# Recovery copy for the RESOLVED half of an `audience: both` alert, used when the rule
# declares no `public_resolved_summary` annotation. Never the firing wording — a ✅ marker
# over "…is experiencing issues…" is worse than silence. Blank here (or an empty
# VIPTALK_PUBLIC_RESOLVED_SUMMARY) falls back to the same string held as the default in
# AlertMessageFormatter, so an empty compose variable cannot turn recovery notices off.
# The wording is product-facing: review it before the first prod send.
viptalk.public-resolved-summary=UPDATE: the issue reported earlier has been resolved. Everything is operating normally again. Thank you for your patience.
# Stamped into every message header so prod / loadtest / staging are distinguishable in a
# shared room (AD-7) — the three instances run the same artifact, and this label is the only
# thing telling them apart. Deliberately EMPTY by default: an unset label omits the segment
# (claims nothing) and logs a WARN at startup, whereas a default of `staging` would make an
# un-overridden prod box stamp prod outages `staging` — which reads as "ignore me".
# Set per instance: VIPTALK_INSTANCE_LABEL=prod | loadtest | staging.
viptalk.instance-label=
viptalk.connect-timeout-seconds=5
viptalk.read-timeout-seconds=10

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers,prometheus
management.endpoint.health.show-details=always
# Common tag applied to every Micrometer meter so Prometheus can distinguish
# bot-manager metrics from other apps that might share the scrape target list.
management.metrics.tags.application=bot-manager
# Spring Boot 3.x: enable Prometheus registry export. Defaults to true when the
# dependency is on the classpath; setting it explicitly guards against future
# default changes.
management.prometheus.metrics.export.enabled=true
springdoc.show-actuator=true

# IP address sent in all login and registration request bodies
# Replace with server's actual IP once it is whitelisted
bot.ip=16.162.36.69

# Auto-deposit top-up amount, in the product's own currency units.
# Applied when a bot's balance falls below Bot.getMinBalance() and the group has
# autoDepositEnabled. Environment-dependent — override per instance (e.g.
# BOT_DEPOSIT_AMOUNT) rather than editing this default.
bot.deposit.amount=1000000000

# Periodic Logout Configuration
# Enables periodic logout/reconnect cycle for bots to refresh connections
bot.periodic-logout.enabled=true
# Interval between logout cycles in minutes (one bot logs out per interval, round-robin)
bot.periodic-logout.interval-minutes=60
# Delay in seconds between logout and reconnect
bot.periodic-logout.reconnect-delay-seconds=5

# Timed Activation Configuration (TIMED_ACTIVATION AD-5, AD-8)
# App-wide business wall-clock zone the recurring activation windows are interpreted in.
# Explicitly configured (not server-local) so it is stable across Docker instances
# regardless of container TZ. Read in exactly one place (the reconciler).
bot.activation.zone=Asia/Ho_Chi_Minh
# Reconcile cadence in seconds. Default 60 = minute granularity; the first tick is
# aligned to the next wall-clock minute boundary so window edges flip on clean marks.
bot.activation.tick-seconds=60

# Scoped per-group DEBUG (LOG_VOLUME_TIERING Phase 2, AD-9..AD-12)
# Raises ONE bot group's lines to DEBUG through an INFO logger, for a bounded time.
# The alternative -- /actuator/loggers with {"configuredLevel":"DEBUG"} -- is GLOBAL and
# at ten prod environments is a ~5 GB/hour action; it is the shape that filled the disk
# on 2026-06-30. Master switch: off means the log4j2 filter is never installed and
# POST /api/v1/logging/debug/{id} answers 400.
bot.logging.scoped-debug.enabled=true
# TTL used when the caller names no `minutes`. The TTL is mandatory -- there is no
# open-ended form -- because the failure mode of "turn on detail" is forgetting to turn
# it off, and here forgetting costs disk.
bot.logging.scoped-debug.default-minutes=15
# Ceiling on any single TTL.
bot.logging.scoped-debug.max-minutes=120
# Ceiling on simultaneously scoped groups, so scoped DEBUG cannot be reassembled into
# fleet-wide DEBUG one call at a time.
bot.logging.scoped-debug.max-scopes=50

# Auto-escalation (AD-12): arm scoped DEBUG on early-warning signals, BEFORE a group dies.
# Escalating on DEAD would produce logs of a group that has stopped doing anything.
bot.logging.scoped-debug.escalation.enabled=true
# TTL granted by an escalation.
bot.logging.scoped-debug.escalation.minutes=15
# QUIET PERIOD AFTER THE SCOPE LAPSES -- not "minutes between escalations". A group may not
# re-arm until escalation.minutes + this. Measuring it from the escalation instead is the
# obvious spelling and it is broken: set equal to the TTL (as this used to be) the two lapse
# together, so a group parked mid-band -- deteriorating but never declared DEAD -- re-arms on
# the next 30 s health tick and sits at DEBUG ~96% of the time with nobody having typed a
# command. The bound that matters is the duty cycle: escalation.minutes / (escalation.minutes
# + cooldown-minutes) = 15/60 = 25% of any window, however hard the group flaps.
bot.logging.scoped-debug.escalation.cooldown-minutes=45
# Reconnect trigger: this many reconnect events for one group inside the window below.
bot.logging.scoped-debug.escalation.reconnect-threshold=5
bot.logging.scoped-debug.escalation.reconnect-window-minutes=5
# The third trigger has no property of its own: it fires when a group's dead/total
# crosses HALF of bot.group.dead.threshold while still under it.

# Reconnection Configuration
# Seconds without any game message before the watchdog triggers a full bot reconnect
bot.watchdog.timeout.seconds=180
# Fraction (0.0–1.0) of DEAD bots required before the entire group is marked DEAD
bot.group.dead.threshold=0.80

# Cash-out bots (GameType.CASHOUT, 119 Balloon / Soccer -- docs/plans/CASHOUT_BOT.md AD-9).
# A bet that gets no frame for frame-timeout-seconds (measured from its LAST frame, not from
# the bet's start -- a bet legitimately streams for ~20 s) is abandoned as a timeout. The
# watchdog is armed only while a bet is in flight, so an idle bot never reconnects for silence.
bot.cashout.frame-timeout-seconds=20
# After a timeout the next bet waits at least this long, and stakes the cheapest eligible
# amount (a probe) until a frame arrives, so a server that silently debits costs little.
bot.cashout.timeout-backoff-seconds=30
# Reconnect at R, 2R, 4R ... 32R consecutive timeouts (3, 6, 12, 24, 48, 96), then every 32R.
# The doubling is what keeps a fleet of silent bots from re-logging-in ~40 times a minute
# against the 1k/5 min Cloudflare budget. Only a received frame resets the count.
bot.cashout.reconnect-after-timeouts=3

# Dead-Group Auto-Recovery (docs/plans/DEAD_GROUP_AUTO_RECOVERY.md)
# Master switch for the recovery *reconciler* (Phase 3). Ships false: the code lands
# inert, is enabled on staging via BOT_RECOVERY_ENABLED, and the compiled default is
# flipped only after a soak (AD-6). It does NOT gate the probe below — observing is
# always safe, and it is what makes the probe verifiable on its own.
bot.recovery.enabled=false
# Cadence of the environment WebSocket reachability probe. The probe runs only while
# at least one recovery candidate exists, so a healthy fleet generates zero probe
# traffic.
bot.recovery.probe.tick-seconds=60
# Connect + handshake timeout for a single probe attempt.
bot.recovery.probe.timeout-seconds=5
# Consecutive healthy probes before an environment counts as healthy (AD-12). One
# 200 from a flapping origin is not evidence; at the default cadence this is ~60 s
# of sustained health.
bot.recovery.probe.healthy-streak=2
# Cadence of the recovery reconciler itself (Phase 3). Its tick BLOCKS for the whole
# duration of one group start, which is the serialisation mechanism (AD-9) -- never
# add time-sensitive work to it; that is what the probe's own scheduler is for.
bot.recovery.tick-seconds=60
# Random 0..N second offset applied to the reconciler's FIRST tick only, so three app
# instances recovering from one shared outage do not align (AD-9).
bot.recovery.jitter-seconds=30
# Attempt budget per death episode (AD-8), then one ERROR and hand off to a human.
# Budget is spent only on actual attempts, and an attempt only happens when the probe
# says the environment is healthy -- an environment down for six hours costs zero.
bot.recovery.max-attempts=6
# Minutes to wait after the n-th failed attempt, clamped to the last entry. Six
# attempts therefore span ~2 h before the hand-off.
bot.recovery.backoff-minutes=2,5,15,30,60,60
# At most this many recovery attempts per tick. 1 on a 60 s tick means ten dead groups
# recover over ten minutes with no rate limiter, no semaphore and no thread pool.
bot.recovery.max-per-tick=1
# How long a recovered group must stay out of the candidate set before its attempt
# budget resets. Without it, a group that flaps ACTIVE/DEAD would earn a fresh budget
# on every flap.
bot.recovery.settle-minutes=10

# Gateway Request Budget (docs/plans/GATEWAY_REQUEST_BUDGET.md)
# Cloudflare rate-limits every gwms gateway at 1,000 requests / 5 min / source IP. A
# breach is not a slow-down: the edge refuses EVERY request from this host for that
# gateway — login, re-auth, verifytoken, deposit — and the one observed block outlived a
# full hour while every reconnect loop kept feeding it. This budget is CEO policy, not a
# tuning preference.
#
# observe | enforce. Ships `observe`: the facade counts, tags, logs and publishes the
# window and NEVER waits, refuses or opens a circuit, so it is deployable to prod
# unchanged. Enforcement EXISTS since Phase 3 — queues, per-tier ceilings, cancellable waits,
# declared demand — and this flag is the only thing standing between it and a fleet, so the
# compiled default is flipped only after a week of staging in enforce (Phase 6). Switch it per
# box with GATEWAY_BUDGET_MODE in secrets.env/.env — never in docker-compose.yml.
#
# Flipping the compiled default is a THREE-file edit; see the essential.ceiling note below.
bot.gateway.budget.mode=observe
# Width of the sliding window. This is the Cloudflare rule itself; do not "tune" it.
bot.gateway.budget.window=5m
# Absolute ceiling per window, every tier. 900 against a limit of 1,000 is the margin for
# what we do not control the accounting of: whether the edge counts 4xx responses, and
# whether a WebSocket upgrade counts at all (see count-ws-upgrades). Startup fails if
# this reaches 1000 and warns above 900.
bot.gateway.budget.hard-cap=900
# Per-tier ceilings, and they must be monotonic (default <= prioritized <= essential <=
# hard-cap) — the GAP between two ceilings IS the reservation for the tier above, so a
# non-monotonic set means the tier below can starve the tier above. Validated at startup.
bot.gateway.budget.tier.default.ceiling=500
bot.gateway.budget.tier.prioritized.ceiling=750
# = hard-cap by default. Open Item 5, decided: it STAYS at the hard cap.
#
# WHAT `essential.ceiling=850` ACTUALLY DOES, because the plan described it wrongly and it is a
# knob an operator has been told exists (QA Q4). It LOWERS THE EFFECTIVE CAP TO 850. It does NOT
# hand 50 requests to re-auth and deposit, for two reasons:
#   1. PRIORITIZED's own ceiling is 750, so once the window holds 750 requests PRIORITIZED is
#      refused regardless of what ESSENTIAL's ceiling says. The 50 between 850 and 900 is
#      reachable by NOTHING.
#   2. The hard-cap check in the admission rule is unreachable by construction: validation
#      enforces `essential.ceiling <= hard-cap` and ESSENTIAL has no tier above it to reserve
#      for, so ESSENTIAL's ceiling is always the binding limit. `hard-cap` is the number
#      validation measures the ceilings against, not a second gate they pass through.
# GatewayBudgetSettingsTest pins that arithmetic so this description cannot drift from it again.
#
# THE KNOB FOR PRIORITIZED STARVATION DURING A LARGE START IS NOT THIS ONE. A start reserves
# `botCount x 3` at ESSENTIAL, and it is the RESERVATION — not `essential.ceiling` — that drives
# PRIORITIZED's and DEFAULT's effective ceilings to zero for the duration of a build of more than
# ~250 bots. If re-auth and deposit starvation bites, the levers are: raise
# `prioritized.ceiling` (which does nothing while the reservation is outstanding), or shrink the
# declared demand, or accept it — the answer Open Item 5 gave.
#
# IT IS NOT A ONE-LINE EDIT, though, and that is A5.4 / A20.12: changing it here alone fails
# the build. Three places declare the same number and ApplicationContextLoadsTest asserts the
# BOUND bean equals GatewayBudgetSettings.defaults() — deliberately, because three independent
# copies is exactly the shape in which one silently drifts and a box's real ceiling stops being
# the one the plan reasoned about. Change all three together:
#   1. this line
#   2. GatewayBudgetConfig's @Value fallback (bot-app/.../config/gateway/GatewayBudgetConfig.java)
#   3. GatewayBudgetSettings.defaults() (bot-engine/.../infrastructure/gateway/)
# The same applies to the Phase 6 mode flip (observe -> enforce).
bot.gateway.budget.tier.essential.ceiling=900
# How long a request of each tier may wait for admission. 0 means unbounded (but always
# cancellable) and is legal for ESSENTIAL only. The rule behind that (A16.2) is: an unbounded
# wait is admissible only where progress is GUARANTEED. The sliding window guarantees it —
# stamps expire, so a 3,000-bot start is ~10 windows of monotonic progress. An unbounded DEFAULT
# wait would park a registration thread (or a ws-parser message-processor thread) for the life of
# the process, with no such guarantee. A Cloudflare edge block guarantees nothing either, which
# is why an open circuit REFUSES every tier rather than parking any of them. Live since Phase 3.
bot.gateway.budget.tier.default.max-wait=30s
bot.gateway.budget.tier.prioritized.max-wait=10m
bot.gateway.budget.tier.essential.max-wait=0
# Wait override for registration (AD-19), so an admitted registration finishes rather
# than half-finishes when a group start floods the window mid-way.
bot.gateway.budget.registration.max-wait=15m
# Whether a WebSocket upgrade is stamped into the window. Open Item 1 is CLOSED (A15,
# user-confirmed): the WS hosts ARE behind the same Cloudflare rule as the /gwms/v1/* API host,
# so `true` is fact rather than the conservative guess it shipped as, and it costs a third of the
# window on a group start because those upgrades are real requests. It survives as a KILL SWITCH.
# Turning it off does not make an upgrade un-cancellable or sendable into an open circuit (A5.2):
# it only stops the upgrade consuming and waiting on the window.
bot.gateway.budget.count-ws-upgrades=true
# How often an open circuit issues its ONE anonymous clearance probe while a Cloudflare edge
# block is in force. This was `block-cooldown=15m`, and that name was the wrong assumption
# written into the config: a block may last ~24 hours or until someone clears it by hand
# (Open Item 7, user-answered), so nothing cools down and traffic never resumes on a timer —
# only a non-block response to a probe closes the circuit. Constant, not exponential.
# 60 minutes costs 24 probes a day against a wall and still notices a human-cleared block
# within the hour; 15 minutes bought nothing but 96. Used from Phase 5.
bot.gateway.budget.block-probe-interval=60m

# Asynchronous account registration (GATEWAY_REQUEST_BUDGET Phase 4, A2)
# A group is created as REGISTRATION_PENDING at 0/botCount and RegistrationWorker creates its
# gateway accounts one at a time, off the request thread. It is NOT a rate limiter — pacing is
# the gateway budget's job — and it must not grow one.
#
# `user.registration.parallelism` is GONE. It sized a Semaphore around a fan-out that no longer
# exists; setting it now does nothing. The worker is single-threaded by design, because
# `registeredCount = k` only means "indices 1..k exist" while registration is serial and
# in-order, and that invariant is what makes a registration resumable at all.
#
# How often the worker looks for a group to work on. It also re-reads the two gauge counts, so
# this is the resolution of registration_pending_groups / registration_failed_groups. A create
# does not wait for it — BotGroupService enqueues the group immediately after persisting it.
bot.registration.tick-seconds=10
# Consecutive GATEWAY refusals of one account before the group is marked REGISTRATION_FAILED and
# left for an operator. A budget timeout or an open circuit is NOT one of these (A2.6): those say
# "not now", cost nothing, and simply re-queue the group.
bot.registration.max-attempts-per-user=3
# Distinct display names tried per account in one pass. The pool collides often — ~43% observed
# at 100 bots on the 5k-name file — so retrying is the normal path. A nameless account is not
# cosmetic: one in a RIK ziczac room stalls the round engine for every player in it. So running
# out does NOT leave the account nameless any more (RIK review G1): it is charged as one attempt,
# the next pass re-rolls for the same account, and after max-attempts-per-user the group goes
# REGISTRATION_FAILED naming it. 15, not 5: at 43% per try, 5 exhausts on ~1.5% of accounts (a
# 100-bot group ~77% likely to hit one); 15 on ~3 in a million. Each re-roll is one gateway request,
# spent only on a collision.
bot.registration.display-name-retries=15
# How long a refused account waits before the worker tries it again. It bounds a hot loop against
# a gateway that just said no; the attempt budget above bounds the total.
bot.registration.failure-backoff-seconds=30
# The SEPARATE, larger budget for a TRANSPORT failure — an IOException, a connect or read timeout,
# a reset — as opposed to a gateway ANSWER (review S3). "We could not ask" says neither yes nor no,
# and with one shared budget a ~60-second network blip spent all three attempts above and left a
# 500-account create REGISTRATION_FAILED with a socket message in registrationError, needing a
# human. Ten at the 30 s backoff above is ~5 minutes of blip tolerance; it still stops eventually,
# because a group that cannot reach its gateway at all must not be invisible. Floored at
# max-attempts-per-user.
bot.registration.max-transport-attempts-per-user=10
# How long a group whose environment refused it ON THE BUDGET is passed over for (review B2).
# A budget deferral costs no attempt (A2.6) — but without this it cost nothing at all, so the same
# group was the oldest due PENDING group on the very next tick, forever, and ONE starved
# environment suspended account creation for every group in the JVM. Floored at tick-seconds, so
# another group always gets a turn. Watch RegistrationNotProgressing for the shape.
bot.registration.deferral-backoff-seconds=60
# BOT_PROVISIONING AD-3: upper bound on a group's initialDeposit (credited to each account at
# registration), in brand currency units. Equal to bot.deposit.amount by default; products differ
# in currency scale, so set it per box if needed (plan Open Item 5).
bot.provisioning.max-initial-deposit=1000000000
