# src/main/resources/application.properties

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/botmanager

server.port=8085

# Change the path for Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Change the path for OpenAPI docs
springdoc.api-docs.path=/v3/api-docs

# Set a custom server URL (optional)
springdoc.api-docs.server.url=http://localhost:8085

# Netty EventLoopGroup Configuration
# Number of threads for WebSocket event loop
# Production (few hundred bots): 2-4 threads
# Load testing (hundreds of thousands): 16-32 threads or higher
websocket.eventloop.threads=4

# Game Microservice Configuration
# Global URL for game microservice (used by GameMsClient for deposits)
gamems.url=http://gamems.dev:5007

# Prometheus Configuration
# Base URL bot-manager uses to query Prometheus for the metrics API
# (PrometheusQueryClient). Compose service name on the internal network.
# Internal-only — never exposed to the UI.
prometheus.url=http://prometheus:9090

# Metrics API caching (METRICS_API AD-8). Short server-side TTL on Prometheus
# query results so polling UI clients don't amplify load onto Prometheus.
# Dependency-free in-process cache; 0 disables caching.
metrics.cache.ttl-seconds=5

# Metrics API rate limit (METRICS_API AD-9). Per-client (per-IP) token-bucket
# guard on /api/v1/metrics/** — these are public+unauthenticated and hit
# Prometheus, so cap the request rate. Exceeding the limit returns HTTP 429.
metrics.ratelimit.requests-per-minute=120

# RTP window substitution (METRICS_IMPROVEMENT AD-6). RTP templates store the
# Grafana-only $__range token; MetricsQueryService swaps it for these concrete
# windows before dispatch (the token must never reach Prometheus).
# summary-window: instant query window for the headline long-term RTP (= retention).
metrics.rtp.summary-window=30d
# timeseries-window: per-point sliding window for the RTP chart.
metrics.rtp.timeseries-window=1h

# VipTalk Alerting (VIPTALK_ALERTING)
# Outbound alerts / announcements into the VipTalk messenger, routed per product.
# Room IDs are NOT configured here — they live on ProductCode (AD-1), one per product.
# Disabled by default: with no bot token there is nothing to send to, and an enabled
# channel with a blank token self-disables with an ERROR rather than failing startup (AD-3).
viptalk.enabled=false
viptalk.base-url=https://api.viptalk.org
# Bot token. NEVER commit a real token — set VIPTALK_BOT_TOKEN in the environment (AD-2).
viptalk.bot-token=
# Room for `audience: internal` alerts — fundamental infrastructure only (host CPU / RAM /
# storage, app down or restarted). It also receives, tagged as misrouted, any product-scoped
# alert whose product has no room wired yet (VIPTALK_ALERTING_V2 AD-V5). Blank = such
# messages are dropped with a WARN instead of being delivered.
viptalk.ops-room-id=
# Customer-facing copy for `audience: both` alerts, delivered to the product room in a
# non-technical register (AD-V7). PROD ONLY — with this on, every staging restart would
# announce "the application is experiencing issues" in a live product room.
viptalk.customer-notices-enabled=false
# Recovery copy for the RESOLVED half of an `audience: both` alert, used when the rule
# declares no `public_resolved_summary` annotation. Never the firing wording — a ✅ marker
# over "…is experiencing issues…" is worse than silence. Blank here (or an empty
# VIPTALK_PUBLIC_RESOLVED_SUMMARY) falls back to the same string held as the default in
# AlertMessageFormatter, so an empty compose variable cannot turn recovery notices off.
# The wording is product-facing: review it before the first prod send.
viptalk.public-resolved-summary=UPDATE: the issue reported earlier has been resolved. Everything is operating normally again. Thank you for your patience.
# Stamped into every message header so prod / loadtest / staging are distinguishable in a
# shared room (AD-7) — the three instances run the same artifact, and this label is the only
# thing telling them apart. Deliberately EMPTY by default: an unset label omits the segment
# (claims nothing) and logs a WARN at startup, whereas a default of `staging` would make an
# un-overridden prod box stamp prod outages `staging` — which reads as "ignore me".
# Set per instance: VIPTALK_INSTANCE_LABEL=prod | loadtest | staging.
viptalk.instance-label=
viptalk.connect-timeout-seconds=5
viptalk.read-timeout-seconds=10

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers,prometheus
management.endpoint.health.show-details=always
# Common tag applied to every Micrometer meter so Prometheus can distinguish
# bot-manager metrics from other apps that might share the scrape target list.
management.metrics.tags.application=bot-manager
# Spring Boot 3.x: enable Prometheus registry export. Defaults to true when the
# dependency is on the classpath; setting it explicitly guards against future
# default changes.
management.prometheus.metrics.export.enabled=true
springdoc.show-actuator=true

# IP address sent in all login and registration request bodies
# Replace with server's actual IP once it is whitelisted
bot.ip=16.162.36.69

# Auto-deposit top-up amount, in the product's own currency units.
# Applied when a bot's balance falls below Bot.getMinBalance() and the group has
# autoDepositEnabled. Environment-dependent — override per instance (e.g.
# BOT_DEPOSIT_AMOUNT) rather than editing this default.
bot.deposit.amount=1000000000

# Periodic Logout Configuration
# Enables periodic logout/reconnect cycle for bots to refresh connections
bot.periodic-logout.enabled=true
# Interval between logout cycles in minutes (one bot logs out per interval, round-robin)
bot.periodic-logout.interval-minutes=60
# Delay in seconds between logout and reconnect
bot.periodic-logout.reconnect-delay-seconds=5

# Timed Activation Configuration (TIMED_ACTIVATION AD-5, AD-8)
# App-wide business wall-clock zone the recurring activation windows are interpreted in.
# Explicitly configured (not server-local) so it is stable across Docker instances
# regardless of container TZ. Read in exactly one place (the reconciler).
bot.activation.zone=Asia/Ho_Chi_Minh
# Reconcile cadence in seconds. Default 60 = minute granularity; the first tick is
# aligned to the next wall-clock minute boundary so window edges flip on clean marks.
bot.activation.tick-seconds=60

# Scoped per-group DEBUG (LOG_VOLUME_TIERING Phase 2, AD-9..AD-12)
# Raises ONE bot group's lines to DEBUG through an INFO logger, for a bounded time.
# The alternative -- /actuator/loggers with {"configuredLevel":"DEBUG"} -- is GLOBAL and
# at ten prod environments is a ~5 GB/hour action; it is the shape that filled the disk
# on 2026-06-30. Master switch: off means the log4j2 filter is never installed and
# POST /api/v1/logging/debug/{id} answers 400.
bot.logging.scoped-debug.enabled=true
# TTL used when the caller names no `minutes`. The TTL is mandatory -- there is no
# open-ended form -- because the failure mode of "turn on detail" is forgetting to turn
# it off, and here forgetting costs disk.
bot.logging.scoped-debug.default-minutes=15
# Ceiling on any single TTL.
bot.logging.scoped-debug.max-minutes=120
# Ceiling on simultaneously scoped groups, so scoped DEBUG cannot be reassembled into
# fleet-wide DEBUG one call at a time.
bot.logging.scoped-debug.max-scopes=50

# Auto-escalation (AD-12): arm scoped DEBUG on early-warning signals, BEFORE a group dies.
# Escalating on DEAD would produce logs of a group that has stopped doing anything.
bot.logging.scoped-debug.escalation.enabled=true
# TTL granted by an escalation.
bot.logging.scoped-debug.escalation.minutes=15
# One escalation per group per this many minutes, so a flapping group cannot hold DEBUG
# open forever by re-triggering.
bot.logging.scoped-debug.escalation.cooldown-minutes=15
# Reconnect trigger: this many reconnect events for one group inside the window below.
bot.logging.scoped-debug.escalation.reconnect-threshold=5
bot.logging.scoped-debug.escalation.reconnect-window-minutes=5
# The third trigger has no property of its own: it fires when a group's dead/total
# crosses HALF of bot.group.dead.threshold while still under it.

# Reconnection Configuration
# Seconds without any game message before the watchdog triggers a full bot reconnect
bot.watchdog.timeout.seconds=180
# Fraction (0.0–1.0) of DEAD bots required before the entire group is marked DEAD
bot.group.dead.threshold=0.80