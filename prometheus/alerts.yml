# Alerting rules for the Bot Manager observability pipeline.
#
# Bind-mounted into the prometheus container at /etc/prometheus/alerts.yml and
# referenced from prometheus.yml's rule_files. Editable on the host without root,
# matching the prometheus.yml / ./logs / ./grafana/provisioning pattern.
#
# Delivery: Prometheus → Alertmanager → bot-manager /api/v1/alerts/alertmanager
# → VipTalk. See docs/plans/VIPTALK_ALERTING.md and VIPTALK_ALERTING_V2.md.
#
# ROUTING (VIPTALK_ALERTING_V2 AD-V3, superseding AD-5). Every rule declares an
# `audience` label, and that label alone decides which rooms see it:
#
#   audience: internal → the ops room only. Infrastructure facts with no owning
#                        product (JVM, host, the app itself being restarted).
#   audience: product  → that product's room only, never the ops room. Everything
#                        that concerns one product's bots.
#   audience: both     → the ops room in the technical register PLUS the product
#                        room in the customer register, rendered from the rule's
#                        `public_summary` annotation (never synthesised from
#                        `summary` — AD-V6 fail-closed).
#
# An absent `audience` defaults to `internal` (AD-V4) so an unlabelled rule can
# never vanish — but that default is a safety net, not a licence: the unit test
# `AlertRulesAudienceTest` parses this file and fails the build if any rule here
# omits it, or if an `audience: both` rule has no `public_summary`.
#
# A product-routed rule must carry `product` (or `environmentId`, which
# bot-manager resolves to a product via Mongo) on its OUTPUT series. Every metric
# used below is per-environment and carries both since VIPTALK_ALERTING_V2
# Phase 1; the `sum by (product, environmentId, …)` clauses are what keep those
# labels on the alert. An `audience: product` alert whose product has no VipTalk
# room yet lands in the ops room tagged `↪️ MISROUTED` (amended AD-V5) — it is
# never dropped.
#
# RETIRED here (VIPTALK_ALERTING_V2 Phase 3, user decision 2026-08-17):
# `BotGroupDead`, `DeadBotRatioHigh`, `WsConnectionsBelowFleet`. They were built
# on the unlabelled fleet aggregates (groups_dead_currently, bots_dead_currently,
# bots_managed, ws_connections_open), which carry no product and so could only
# ever reach the ops room — precisely the product-level noise the ops room is
# meant to be free of. Their per-environment, product-labelled equivalents are
# `EnvironmentSocketDown` / `EnvironmentSocketDegraded`,
# `EnvironmentDeadBotRatioHigh` and `EnvironmentGroupDead` below. The aggregate
# gauges themselves stay (AD-V2): they are dashboard facts, not alert sources.
#
# What retiring `BotGroupDead` cost, and how Phase 4 pays it back: for one phase,
# a DEAD *group* was visible only indirectly, through its bots' DEAD status inside
# `EnvironmentDeadBotRatioHigh`. A small group inside a large environment could
# therefore die without moving that ratio past 0.2. `EnvironmentGroupDead` is the
# first-class replacement, built on the new labelled `groups_dead_by_env` sibling
# of `groups_dead_currently` — a DEAD group stops betting entirely, so it warrants
# its own alert, not a corner of a ratio. (That sentence used to end "a DEAD group
# never recovers on its own and must be restarted by an operator".
# DEAD_GROUP_AUTO_RECOVERY falsified it: a DEAD group now restarts itself once the
# environment probe reports healthy, bounded by an attempt budget. What is still
# true is that a DEAD group is not betting, and that an operator is still the only
# thing that ends the failure the budget hands off — see
# `EnvironmentGroupRecoveryExhausted` below.)
#
# THRESHOLDS ARE FIRST GUESSES. 0.5 / 0.8 socket ratios, the 0.5 auth-failure
# ratio, the >= 5 sample floors, the 0.2 dead-bot ratio, the host disk / RAM / CPU
# levels in the `host` group, and every `for:` window were chosen from the shape of
# past incidents, not from measured data. Expect to tune them once these rules have
# run against a real fleet for a few days.

groups:
  - name: bot-manager-availability
    rules:
      # audience: both — the one alert the product rooms hear about in their own
      # register. `public_summary` is what they get; without it the customer copy
      # is suppressed rather than synthesised from `summary` (AD-V6), and on a
      # non-prod instance the whole customer half is gated off (AD-V7).
      #
      # This is also the ONE alert that cannot be delivered by the normal path: it
      # fires exactly when bot-manager — the webhook receiver that forwards to
      # VipTalk — is unscrapeable. alertmanager.yml therefore routes it to two
      # receivers (AD-V9): the `viptalk-shim` container, which posts to VipTalk
      # directly and delivers the FIRING half while the app is dead, and the normal
      # app webhook, which delivers the RESOLVED half — by definition the app is
      # back when this alert resolves. Keep `public_summary` in step with the shim's
      # built-in customer text (viptalk-shim/shim.py DEFAULT_DOWN_TEXT), or the same
      # outage reads two different ways depending on which path delivered it.
      - alert: BotManagerDown
        expr: up{job="bot-manager"} == 0
        for: 2m
        labels:
          job: bot-manager
          severity: critical
          audience: both
        annotations:
          summary: "bot-manager is not scrapeable"
          description: "Prometheus has failed to scrape bot-manager for 2 minutes — the app is down, wedged, or the container was replaced."
          public_summary: "ALERT! Bot Management application is experiencing issues, backend team is aware and will deliver fixes soon."
          # Recovery copy for the product room. Without it the resolved half would
          # render "…is experiencing issues…" under a ✅ marker, i.e. a green tick over
          # text saying the application is broken — the formatter renders public_summary
          # verbatim and has no way to reword it. The configured fallback
          # (viptalk.public-resolved-summary) would cover this generically; an explicit
          # annotation is better because it can name what recovered.
          public_resolved_summary: "UPDATE: the Bot Management issue reported earlier has been resolved. The application is operating normally again. Thank you for your patience."
          # Ownership of the two halves, declared where the two-path routing is. The
          # shim publishes the FIRING customer copy; the app must not publish it as
          # well. AD-V9 assumed the app's firing notification simply fails while the
          # app is down, but Alertmanager RETRIES, and this alert keeps firing until
          # Prometheus completes a scrape and re-evaluates — tens of seconds after the
          # app is back. A retry landing in that window would tell a product room "we
          # are having issues" AFTER the issue ended, reading as a second outage. With
          # this annotation the app publishes only the recovery half; the ops room is
          # unaffected (the technical register is not gated by it).
          customer_firing_delivered_out_of_band: "true"

      # AD-V10 — deliberately a SEPARATE rule from BotManagerDown, not a variant of it.
      # The app is up when this fires, so it needs no out-of-band delivery and travels
      # the normal webhook. And it is `internal`, not `both`: an already-recovered
      # restart is not something to tell a product room about — by the time anyone read
      # it, it would be describing something that is no longer happening.
      #
      # `changes(...[15m])` sees a restart only when samples from BOTH runs sit in the
      # window, so it catches a redeploy or a crash-restart (seconds to minutes of
      # downtime) and NOT an outage longer than 15 minutes — for which the old series
      # has aged out and only BotManagerDown has anything to say. That is the right
      # split of labour: this rule is for the restart nobody noticed.
      #
      # It fires on planned deploys too. That is intended, not noise: a deploy loses
      # every in-memory bot runtime exactly like a crash does, and the groups need
      # restarting either way. Note Alertmanager's BotManagerDown inhibit (equal: job,
      # and this rule carries job="bot-manager") can hold this back while the down
      # alert is still active — it delays the notification to the next group_interval
      # rather than dropping it, since the expression stays true for 15 minutes.
      - alert: BotManagerRestarted
        expr: changes(process_start_time_seconds{job="bot-manager"}[15m]) > 0
        labels:
          job: bot-manager
          severity: warning
          audience: internal
        annotations:
          summary: "bot-manager restarted (JVM start time changed)"
          description: "An unplanned restart loses all in-memory bot runtimes; groups must be re-started. If this repeats, check for OOM/native-thread exhaustion."

  - name: bot-manager-environment
    rules:
      # A2a — socket down. Mirrors the retired WsConnectionsBelowFleet predicate
      # (Bot.isConnected(), NOT BotStatus) but per environment, so it routes to the
      # product room. ws_connections_open_by_env emits a zero row for every
      # environment that has managed bots, so a total outage still produces a
      # series — the whole point of the per-env gauge pair.
      #
      # The ratio is deliberately the LEFT operand of `and`: `a and b` yields a's
      # values, so writing the guard first would make $value the managed-bot count
      # and render "2000%" for 20 bots. (The retired fleet rule had exactly that
      # defect; the plan's draft of this rule inherited it.)
      - alert: EnvironmentSocketDown
        expr: |
          (ws_connections_open_by_env / bots_managed_by_env) < 0.5
          and bots_managed_by_env > 0
        for: 10m
        labels:
          job: bot-manager
          severity: critical
          audience: product
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of bots hold a WebSocket on env {{ $labels.environmentId }}"
          description: "WS host unreachable, or the PING-before-AUTH race. Check the game server and the WS hostname for this environment."

      - alert: EnvironmentSocketDegraded
        expr: |
          (ws_connections_open_by_env / bots_managed_by_env) < 0.8
          and bots_managed_by_env > 0
        for: 10m
        labels:
          job: bot-manager
          severity: warning
          audience: product
        annotations:
          summary: "{{ $value | humanizePercentage }} of bots hold a WebSocket on env {{ $labels.environmentId }}"
          description: "Reconnect churn above normal for this environment. Below 50% this escalates to EnvironmentSocketDown, which inhibits this alert."

      # Per-environment replacement for the retired DeadBotRatioHigh. A DEAD group's
      # bots are all DEAD, so a dead group also shows up here as a step in its
      # environment's ratio — but only a step: a 5-bot group dying inside a 100-bot
      # environment moves this by 0.05 and never trips 0.2. Dead GROUPS are covered
      # first-class by EnvironmentGroupDead below (Phase 4); this rule is about bots
      # dying across an environment regardless of which group they belong to.
      #
      # Both operands are wrapped in `sum by (product, environmentId)` even though
      # bots_managed_by_env is already at that granularity: Prometheus stamps `job`
      # and `instance` onto every scraped series, so dividing a `sum by (…)` result
      # by a RAW series would compare a 2-label set against a 4-label set and match
      # nothing. Aggregating both sides is what makes the division line up.
      - alert: EnvironmentDeadBotRatioHigh
        expr: |
          (
            sum by (product, environmentId) (bots_by_env_status{status="DEAD"})
            / clamp_min(sum by (product, environmentId) (bots_managed_by_env), 1)
          ) > 0.2
          and sum by (product, environmentId) (bots_managed_by_env) > 0
        for: 10m
        labels:
          job: bot-manager
          severity: warning
          audience: product
        annotations:
          summary: "{{ $value | humanizePercentage }} of bots are DEAD on env {{ $labels.environmentId }}"
          description: "A DEAD bot does not recover on its own. Usual causes: auth gateway rejecting logins, WS host unreachable, or the PING-before-AUTH race. Restart the affected group(s) once the cause is cleared."

      # The first-class dead-GROUP rule, restoring in product-routed form what the
      # retired BotGroupDead used to say. groups_dead_by_env is the labelled sibling
      # of the groups_dead_currently fleet gauge (which stays, AD-V2) and uses the
      # same predicate, so sum(groups_dead_by_env) == groups_dead_currently.
      #
      # No vector matching here on purpose: a bare gauge compared against a scalar.
      # A ratio against a group-count denominator would need a second gauge and a
      # second chance to mismatch label sets, and would buy nothing — one DEAD group
      # is already actionable, whatever fraction of the environment it is.
      #
      # for: 5m, not 10m: the state is already debounced upstream (the health monitor
      # only marks a group DEAD after consecutive failed checks). The window exists so
      # that a restart already in progress does not page anyone — originally an
      # operator-initiated one, and since DEAD_GROUP_AUTO_RECOVERY an automatic one too.
      #
      # The window is DELIBERATELY unchanged by auto-recovery (AD-15). A self-heal
      # inside 5 minutes silently prevents the page, which is the point of the feature;
      # a self-heal after 5 minutes fires this alert and then resolves it, which is the
      # correct record of "it broke and healed". Widening `for:` to hide the second case
      # would equally hide a group that never comes back. What must NOT be hidden is
      # repetition, and that is what the two rules below are for: read a
      # firing-then-resolving pair here as "possibly self-healed", then check
      # EnvironmentGroupRecoveryFlapping.
      - alert: EnvironmentGroupDead
        expr: groups_dead_by_env > 0
        for: 5m
        labels:
          job: bot-manager
          severity: critical
          audience: product
        annotations:
          summary: "{{ $value }} bot group(s) DEAD on env {{ $labels.environmentId }}"
          description: "A DEAD group stops betting entirely. Auto-recovery will restart it by itself — rebuilding the runtime and reusing the existing accounts, no new users, and no deposit a manual /restart would not make (recovery itself moves no money, but a group with autoDeposit on still tops its bots up from their own play loop) — as soon as the environment WebSocket probe reports healthy, so this alert may resolve without anyone acting. Still firing after ~10 minutes means recovery is failing or the environment is still down: check EnvironmentSocketDown / EnvironmentAuthDown for the cause, and env_ws_probe_healthy plus the `auto-recovery attempt` log lines for which of the two it is. The manual path is unchanged (POST /api/v1/bot-group/{id}/restart); POST /{id}/stop parks a group as STOPPED, which is the opt-out from auto-recovery."

      # DEAD_GROUP_AUTO_RECOVERY AD-8 / AD-15 — the hand-off to a human, and the one
      # recovery state nothing else gets out of. The attempt budget (6 attempts,
      # 2/5/15/30/60 minutes apart) is spent ONLY on attempts, and an attempt is made
      # only while the environment probe reads healthy — so exhaustion never means "the
      # environment was down for two hours". It means the environment ANSWERED and the
      # group still would not come up, ~2 hours after it died. Nothing will try again
      # until an operator acts. Hence critical, where the flapping rule below is only a
      # warning: this is the state in which the fleet has given up and said so.
      #
      # increase(...[15m]) > 0, not a gauge: exhaustion is an EVENT and the counter
      # moves at most once per death episode. 15m is far longer than the 60s recovery
      # tick, so the alert survives long enough to be grouped, delivered and read, and
      # then resolves on its own — which here means "we stopped trying", NOT "fixed".
      # The group is still DEAD and EnvironmentGroupDead is what keeps saying so —
      # except for a group that died before this JVM started, which has no runtime and
      # therefore no groups_dead_by_env, i.e. exactly the longest-down case. So this
      # rule is the ONLY signal for it and it has to work on the first exhaustion.
      #
      # That is only true because the app pre-registers the series at ZERO on the
      # group's first recovery attempt (BotMetrics.initGroupRecoverySeries). A
      # Micrometer counter registered lazily at increment time first appears at 1 and
      # stays at 1 — increase() over samples that are all 1 is last-first = 0, and
      # Prometheus' counter-start extrapolation is gated on resultValue > 0, so it
      # never applies. This rule would then read 0 forever and fire only on a SECOND
      # exhaustion of the same label set, which a JVM restart resets anyway. If the
      # pre-registration is ever removed, this expression silently goes dead; the
      # build guards it (AlertRuleMetricsTest).
      #
      # The counter is tagged from the recovery scheduler's group MDC (AD-13), so it
      # carries botGroupId, environmentId and product — which is what lets a rule about
      # a single group route to that product's room rather than the ops room.
      - alert: EnvironmentGroupRecoveryExhausted
        expr: increase(group_recovery_exhausted_total[15m]) > 0
        labels:
          job: bot-manager
          severity: critical
          audience: product
        annotations:
          summary: "Auto-recovery gave up on bot group {{ $labels.botGroupId }} (env {{ $labels.environmentId }})"
          description: "The recovery attempt budget is spent: every attempt ran against an environment the probe called healthy, and the group still did not come up. Nothing will attempt it again until a human does — POST /api/v1/bot-group/{id}/restart, which also resets the budget once it succeeds. The per-attempt `auto-recovery attempt n/6 failed` WARN lines carry the reason; check EnvironmentAuthDown before retrying, since a gateway that answers but rejects logins produces exactly this shape."

      # DEAD_GROUP_AUTO_RECOVERY AD-15 — recovery working repeatedly is not the same as
      # recovery working. A group that dies and heals three times in six hours has an
      # environment that keeps breaking, and every cycle costs a full per-bot reconnect
      # budget (~51 minutes of a group not betting) before the group is even a recovery
      # candidate. Each of those cycles can resolve inside EnvironmentGroupDead's
      # `for: 5m` and page nobody — that suppression is deliberate (AD-15), so the
      # repetition it hides needs a rule of its own, or the feature quietly converts a
      # visible outage into an invisible one.
      #
      # >= 3 in [6h]: one or two recoveries across a working day is a flaky upstream
      # nobody would act on; three inside six hours is a pattern. The window is per
      # SERIES, i.e. per group — three different groups recovering once each is an
      # environment story EnvironmentGroupDead already tells. `for: 5m` only debounces
      # the evaluation; the condition it debounces is already six hours wide.
      #
      # >= 3 means 3, and that also depends on the pre-registration described on the
      # rule above: outcome="success" is materialised at 0 on the group's FIRST
      # recovery attempt, so increase() measures 0 -> 3. Against a series that first
      # appeared at 1 — the shape a lazily-registered counter produces — increase()
      # computes last-first = 2 and extrapolates to at most 3.0, so the documented
      # threshold of three self-heals silently required a FOURTH. Since recovery state
      # is in-memory and the series goes stale on restart, "fresh series" is the
      # common case, not the exotic one.
      - alert: EnvironmentGroupRecoveryFlapping
        expr: increase(group_recovery_attempts_total{outcome="success"}[6h]) >= 3
        for: 5m
        labels:
          job: bot-manager
          severity: warning
          audience: product
        annotations:
          summary: "Bot group {{ $labels.botGroupId }} has auto-recovered {{ $value }} times in 6h (env {{ $labels.environmentId }})"
          description: "Auto-recovery keeps succeeding, which means something keeps killing this group — recovery is treating a symptom. Each cycle burns the per-bot reconnect budget (~51 minutes of no betting) before recovery is even attempted, so the group is idle far longer than the DEAD windows suggest. Find the cause: EnvironmentSocketDown / EnvironmentAuthDown, the game server, or subscriber pruning. If the group must stay down while that is investigated, POST /api/v1/bot-group/{id}/stop parks it as STOPPED, which is the opt-out from auto-recovery."

      # A2b — login/auth gateway down. verifytoken.aspx runs on every authoritative
      # balance fetch, so this counter moves continuously while bots play; that is
      # what makes it the PRIMARY auth signal. The >= 5 floor keeps a single failed
      # read on an idle environment from paging anyone, and clamp_min guards the
      # divide-by-zero.
      - alert: EnvironmentAuthDown
        expr: |
          (
            sum by (product, environmentId) (increase(bot_verify_token_total{outcome="failure"}[10m]))
            / clamp_min(sum by (product, environmentId) (increase(bot_verify_token_total[10m])), 1)
          ) > 0.5
          and sum by (product, environmentId) (increase(bot_verify_token_total[10m])) >= 5
        for: 10m
        labels:
          job: bot-manager
          severity: critical
          audience: product
        annotations:
          summary: "Auth gateway failing {{ $value | humanizePercentage }} of balance reads on env {{ $labels.environmentId }}"
          description: "verifytoken.aspx is rejecting or unreachable. Bots keep their WS but cannot read balance or re-auth."

      # The corroborating half of A2b. bot_login_total only moves at group start
      # and re-auth, so this rule is SILENT on a steady-state fleet by design —
      # silence here is not evidence that login is healthy, EnvironmentAuthDown is.
      - alert: EnvironmentLoginFailing
        expr: |
          (
            sum by (product, environmentId) (increase(bot_login_total{outcome="failure"}[15m]))
            / clamp_min(sum by (product, environmentId) (increase(bot_login_total[15m])), 1)
          ) > 0.5
          and sum by (product, environmentId) (increase(bot_login_total[15m])) >= 5
        for: 5m
        labels:
          job: bot-manager
          severity: critical
          audience: product
        annotations:
          summary: "{{ $value | humanizePercentage }} of logins failing on env {{ $labels.environmentId }}"
          description: "Only meaningful while logins are being attempted (group start / periodic re-auth). Silence here does not mean login is healthy."

  - name: bot-manager-game
    rules:
      # A1 — game configured and subscribed, but no server rounds arriving.
      # `unless` (not `and`) is load-bearing: a game that has NEVER delivered a
      # round has no bot_messages_total series at all, so `and` would never fire —
      # which is exactly the tx7 / "0 sessions ever" case we most need to catch.
      # cmd="startGame" covers BETTING_MINI/TAI_XIU, cmd="spin" is the server's
      # SpinResult for SLOT (SlotMachineBot.java:213).
      #
      # Both operands MUST reduce to the identical label set — `unless` matches on
      # the full set, so one stray label on either side silences the rule instead
      # of misrouting it. That is why `product` has a single authority (the
      # Environment) for both the gauge rows and the bot_* counters.
      #
      # CONNECTION_AUTHENTICATED, not STARTED: STARTED is stamped before the WS
      # auth completes, while CONNECTION_AUTHENTICATED is set in onSubscribe, i.e.
      # "the server acknowledged our subscription" — precisely "this game is
      # supposed to be sending us rounds".
      - alert: GameNoRounds
        expr: |
          (
            sum by (product, environmentId, gameId, gameName, gameType)
              (bots_by_game_status{status="CONNECTION_AUTHENTICATED"}) > 0
          )
          unless
          (
            sum by (product, environmentId, gameId, gameName, gameType)
              (increase(bot_messages_total{cmd=~"startGame|spin"}[10m])) > 0
          )
        for: 10m
        labels:
          job: bot-manager
          severity: critical
          audience: product
        annotations:
          summary: "No rounds on game {{ $labels.gameName }} (env {{ $labels.environmentId }}) for 20 minutes"
          description: "Bots are subscribed and authenticated but the server is sending no StartGame/SpinResult. Game is stopped server-side, the subchannel is wrong, or subscribers were pruned."

  - name: bot-manager-balance
    rules:
      # A3 — a group that will NOT top itself up is running out of money.
      #
      # group_balance_ratio = avg(expectedBalance over isConnected() bots) / deposit
      # amount, emitted only for groups with auto-deposit OFF and at least one active
      # bot (AD-V13). Both filters are applied in the app, not here: a series simply
      # does not exist for an auto-deposit group (dipping below 10% there is normal
      # operation — it is what triggers the top-up) or for a stopped / fully
      # reconnecting group (which would read 0 and page someone for nothing).
      #
      # A ratio, not an absolute: one threshold then covers every currency scale and
      # deposit size, and 0.10 is the same figure the bots themselves use for
      # MIN_BALANCE_PERCENT_OF_DEPOSIT — i.e. this fires exactly where an
      # auto-deposit group would have topped up.
      #
      # The numerator is expectedCurrentBalance, not lastFetchedBalance (AD-V12):
      # checkBalance() re-reads the server whenever the two diverge by more than 1%
      # of the deposit, so they cannot be further apart than that, which is
      # immaterial at a 10% threshold. The one case where expected is stale — a bot
      # that stopped receiving rounds, so onNewSession() never runs and both values
      # freeze — is GameNoRounds' job, not this rule's.
      #
      # for: 5m absorbs the flap of a group hovering on the line; no app-side
      # throttling (AD-6 / Implementation Note 10).
      - alert: GroupBalanceLow
        expr: group_balance_ratio < 0.10
        for: 5m
        labels:
          job: bot-manager
          severity: warning
          audience: product
        annotations:
          summary: "Group {{ $labels.groupName }} average balance at {{ $value | humanizePercentage }} of its deposit"
          description: "Auto-deposit is OFF for this group, so it will not top itself up. Fund it or enable auto-deposit before the bots stop betting."

      # GATEWAY_REQUEST_BUDGET AD-20 — the per-environment Cloudflare request window.
      #
      # Cloudflare rate-limits every gwms gateway at 1,000 requests / 5 min / source IP, and
      # a breach is not a slow-down: the edge answers an HTML 403 block page to EVERY request
      # from this host for that gateway, so the whole brand cannot log in, re-authenticate,
      # read a balance or deposit — and the one observed block (2026-09-17, ~1,140 requests)
      # had not aged out after a full hour, while every reconnect loop in the fleet kept
      # feeding it. 900 is the app's own hard cap; 800 is the point at which an operator
      # should know a window is filling.
      #
      # Read BARE, so the gauge's own labels (environmentId, product) are the alert's labels.
      # That is deliberate: this is a per-environment fact, and `sum` over environments would
      # hide the one that is about to be blocked behind nine that are idle.
      #
      # for: 1m and not 5m. The window is 5 minutes wide, so a sustained-for-5-minutes
      # condition is already most of a breach; one minute above 800 is the earliest honest
      # signal that is not a single scrape's noise.
      #
      # audience: internal. Nothing is broken for a player yet — this is the warning that
      # precedes GatewayEdgeBlocked (Phase 4), which IS audience: product because at that
      # point no bot on the brand can re-auth. Neither needs an Alertmanager route: with no
      # matching child route they fall through to the viptalk receiver, and only a
      # `continue: true` child would have required a mandatory viptalk sibling.
      #
      # THIS RULE MEANS TWO DIFFERENT THINGS IN THE TWO MODES, and Phase 3 is where that
      # changed (A20.10). In `observe` NOTHING is paced, so firing means requests really are
      # going out at that rate and the only protection is that someone reads it. In `enforce`
      # it means the app is saturating its OWN cap, which during a large group start is
      # NORMAL and expected — AD-18: a 3,000-bot group is ~50 minutes of exactly this. So in
      # enforce it is an FYI, not an incident, and the rule that matters is the sibling below.
      #
      # Expressed as a RATIO against the exported hard cap rather than the literal 800
      # (A5.6/F5). gateway_budget_hard_cap carries the same {environmentId, product} labels
      # from the same target, so the division matches element-wise. 0.89 x 900 = 801, i.e.
      # the same threshold this rule always had — but lowering the cap now TIGHTENS the alert
      # instead of silently disarming it, which is what a hardcoded 800 against a cap of 600
      # would have done.
      #
      # THE COST IS A SECOND SERIES TO LOSE (review F16). A missing, renamed or not-yet-scraped
      # denominator makes this expression return NO SAMPLES, and a rule with no samples never
      # fires — the same "healthiest reading there is" trap CLAUDE.md spells out for
      # LogQueueSaturated's vanished appender. GatewayBudgetCapSeriesMissing below is the
      # companion that makes that state loud instead of silent.
      - alert: GatewayBudgetNearCap
        expr: gateway_budget_window_requests / gateway_budget_hard_cap > 0.89
        for: 1m
        labels:
          job: bot-manager
          severity: warning
          audience: internal
        annotations:
          summary: "Environment {{ $labels.environmentId }} is at {{ $value | humanizePercentage }} of its gateway request cap for the last 5 minutes (Cloudflare blocks at 1000)"
          description: "In observe mode nothing is being paced, so this is the run-up to a whole-brand auth outage: check what is driving it (a large group start, a reconnect storm, a bulk registration, or scripts/bulk-create-accounts.py running from this same host, which the app's budget cannot see) and stagger it. In enforce mode the cap is holding and this is expected during a large start — AD-18 puts a 3,000-bot group at ~50 minutes — so treat it as an FYI and look at GatewayBudgetSustainedQueue instead. gateway_budget_requests_total by tier says which class of request it is; the 5-minute fleet rollup line carries the same window per environment."

      # The companion F16 asks for: the denominator vanishing must not look like health.
      # `gateway_budget_window_requests` without a matching `gateway_budget_hard_cap` means
      # GatewayBudgetNearCap above is evaluating to nothing at all — an environment sending
      # traffic with its cap series gone is unwatched, not safe. Both gauges are registered
      # together in SlidingWindowGatewayBudget.registerMeters, so this fires only on a rename or
      # a partial scrape, which is exactly when nobody is looking for it.
      # absent(), not `unless`: the two gauges are registered together per budget
      # (SlidingWindowGatewayBudget.registerMeters), so per-environment partial absence is not
      # expressible — what IS expressible is a rename or a scrape that stopped returning the
      # denominator at all, and absent() is the idiom for exactly that.
      - alert: GatewayBudgetCapSeriesMissing
        expr: absent(gateway_budget_hard_cap) and (count(gateway_budget_window_requests) > 0)
        for: 10m
        labels:
          job: bot-manager
          severity: warning
          audience: internal
        annotations:
          summary: "gateway_budget_hard_cap is missing while gateway_budget_window_requests is being scraped"
          description: "GatewayBudgetNearCap is a ratio of the two, so with the denominator gone it returns no samples and can never fire — the run-up to a whole-brand Cloudflare block would be completely unalerted. Both gauges are registered together in SlidingWindowGatewayBudget.registerMeters, so check for a metric rename in that method, or a scrape that is only partially succeeding."

      # The rule that matters under `enforce`, and the gap A20.10 names: near-cap stops being
      # the interesting shape once the cap is being enforced, because near-cap is what a
      # working large start looks like. What hurts is SUSTAINED QUEUEING — a group that cannot
      # finish coming up because something else keeps taking the window, or a reconnect storm
      # (~180 upgrades per window from two sick groups was measured on staging, A15.3) holding
      # the queue open indefinitely.
      #
      # ESSENTIAL only, deliberately. DEFAULT queueing is the design working: registration and
      # drift balance reads are meant to yield, and a DEFAULT queue during a start is expected.
      # An ESSENTIAL queue that is still non-empty after 15 minutes means bots that are trying
      # to come up are not coming up, which is the only queue shape an operator must act on.
      #
      # for: 15m over a min_over_time[15m], i.e. ~30 minutes of a continuously non-empty
      # ESSENTIAL queue.
      #
      # IT FIRES ON THE LARGEST LEGITIMATE START, AND THE ANNOTATION SAYS SO (QA Q5.2 / A27.2).
      # AD-18 puts a 3,000-bot group at 33-50 minutes of exactly this shape, so a start of more
      # than ~1,800 bots will trip it for the remainder of its build. The first version of this
      # rule's description said "this is not a large start passing through — it is a start that
      # cannot finish", which is false for precisely the case the feature was sized against. It
      # is `warning` + `audience: internal` and falls through to viptalk, so the cost is one
      # spurious warning per very large start, and A20.10 explicitly allowed "or accept that V3
      # is read by hand" — so the rule is a bonus rather than a requirement.
      #
      # DECIDE THE THRESHOLD AT PHASE 6, with V3b's real numbers in hand: either widen `for:` to
      # 45m (which gives up on detecting a stuck small group inside an hour) or keep 15m and rely
      # on the correlation the annotation asks for. Do not silently leave a false annotation.
      #
      # audience: internal. Nothing is broken for a player: the bots are queued, not failing.
      - alert: GatewayBudgetSustainedQueue
        expr: min_over_time(gateway_budget_queue_depth{tier="ESSENTIAL"}[15m]) > 0
        for: 15m
        labels:
          job: bot-manager
          severity: warning
          audience: internal
        annotations:
          summary: "Environment {{ $labels.environmentId }} has had ESSENTIAL gateway requests queued continuously for ~30 minutes ({{ $value }} still waiting)"
          description: "Bots that are trying to come up are being paced. min_over_time > 0 means the queue never emptied once in the window. FIRST correlate with the group's 'start admitted — declared demand N requests, env window W/900, estimated M min' INFO line: a start of more than ~1,800 bots is EXPECTED to hold this queue for its whole build (AD-18: ~50 minutes for 3,000 bots), and that is the budget working. It is a problem when no such start is in flight, or when the queue outlives the estimate. Then check gateway_budget_window_requests against gateway_budget_ceiling (who is consuming the window), gateway_budget_reserved (a leaked declared demand from a build whose teardown did not run), and GET /api/v1/bot-group/{id}/status for botsUp and lastError. A reconnect storm on a sick group is the other usual cause: bot_reconnects_total by group."

  - name: bot-manager-jvm
    rules:
      # The thread-leak sawtooth (resolved by the ws-parser 3.0.5 bump) showed as
      # unbounded live-thread growth ending in native-thread exhaustion and a JVM
      # restart. This is the regression guard for it. Fleet-wide JVM fact with no
      # owning product, so audience: internal (B2).
      - alert: JvmThreadsHigh
        expr: jvm_threads_live_threads > 2000
        for: 15m
        labels:
          job: bot-manager
          severity: warning
          audience: internal
        annotations:
          summary: "JVM live threads at {{ $value }}"
          description: "Sustained high thread count — the thread-leak sawtooth signature. Check reconnect churn and executor lifecycles before the JVM exhausts native threads."

      # PLUGIN_HOT_RELOAD Phase 1 / AD-7. The classloader-leak detector, shipped BEFORE
      # the mechanism that can cause one (step 4's child classloader) — the thread-leak
      # sawtooth was diagnosable only because jvm_threads_live_threads predated it, and a
      # detector shipped in the same release as the leak proves nothing about the release.
      #
      # WHY THIS IS SAFE TO SHIP WITHOUT A BASELINE: today the application has no
      # mechanism to grow metaspace. Classes are loaded at boot and essentially never
      # after, so the expected 24 h delta is ~0 and any sustained 50 MiB/day is already
      # anomalous. If it fires in the first week, that is a PRE-EXISTING leak that must be
      # understood before any child classloader is introduced — not a threshold problem.
      #
      # WHY METASPACE AND NOT THE HEAP: the container runs with -XX:MaxRAMPercentage=75
      # and -XX:+ExitOnOutOfMemoryError but NO -XX:MaxMetaspaceSize (Dockerfile), so a
      # classloader leak never raises OutOfMemoryError: Metaspace, ExitOnOutOfMemoryError
      # never fires, and the container is OOM-killed by the kernel instead — silently,
      # with no Java-side evidence. On a box that has already died once and taken Mongo
      # with it (2026-06-30), this rule is the only warning that shape of failure gets.
      # The cap itself lands with step 4, sized from Phase 1's 7-day baseline (AD-6).
      #
      # 50 MiB/24 h is a FIRST GUESS, like every other threshold in this file. Tune once
      # the 7-day baseline (verification P1-10) is in hand. Read that baseline off a JVM
      # with >24 h of uptime, or the boot ramp below gets baked into the tuned number.
      #
      # WHY THE UPTIME GATE (plan Amendment A3 — AD-7 as written shipped without it and
      # was wrong). Metaspace is NOT flat through a restart: it ramps ~0 -> ~90-140 MB as
      # Spring Boot, Mongo, Netty, Jackson, Micrometer, MapStruct and springdoc load, which
      # is several times this threshold. Two things then compound. delta() extrapolates a
      # partially-covered range exactly like rate() does, so at 2 h of uptime a real +70 MB
      # reports as ~840 MB; and once the range IS covered, delta is value(now) -
      # value(24h ago), and for the first 24 h after a restart that second term is the
      # near-zero reading taken as the JVM started. So the ungated expression is
      # continuously true from ~T+1h (when `for: 1h` is satisfied) to T+24h after EVERY
      # restart — deploys, crash-restarts, OOM-kills, and the deploy that ships this rule.
      #
      # That is worse than noise. The comment above tells an operator that a firing in the
      # first week is a pre-existing leak; ungated, the first week's firings are the boot
      # ramp, so the operator either chases a phantom or mutes the rule — and this rule is
      # the ONLY warning the container gets for a classloader leak (see below). An
      # instrument that lies in the direction that gets it muted is the exact failure this
      # phase exists to prevent.
      #
      # The gate is the process_start_time_seconds idiom BotManagerRestarted already uses
      # (line 124). `and on(job)` because both sides carry job="bot-manager" and there is
      # one bot-manager target per Prometheus (prometheus.yml). 86400 = the [24h] window:
      # the rule may only evaluate once the window contains no boot ramp at all.
      #
      # delta() is KEPT rather than swapped for max_over_time - min_over_time. With the
      # gate the range is always fully covered, so the extrapolation pathology is gone, and
      # delta stays directional — max-min cannot be negative and would fire on a spike that
      # had already recovered, which is not what "metaspace is growing" means.
      #
      # The companion rule PluginClassLoadersRetained —
      #   sum(plugin_classloaders_live) > 2 for: 2h
      # — is deliberately NOT here: it is identically 1 until step 5 puts two versions in
      # one JVM, and a rule that can only be false teaches nobody anything. It ships at
      # step 6. Fleet-wide JVM fact with no owning product, so audience: internal.
      - alert: MetaspaceGrowth
        expr: delta(jvm_memory_used_bytes{area="nonheap",id="Metaspace"}[24h]) > 52428800 and on(job) (time() - process_start_time_seconds{job="bot-manager"} > 86400)
        for: 1h
        labels:
          job: bot-manager
          severity: warning
          audience: internal
        annotations:
          summary: "Metaspace grew by {{ $value | humanize1024 }}B in 24h"
          description: "Metaspace should be flat — classes are loaded at boot and not after. The rule only evaluates above 24h of uptime, so this is NOT the boot ramp. Sustained growth is a classloader leak, and with no -XX:MaxMetaspaceSize it ends in a kernel OOM-kill rather than an OutOfMemoryError. Cross-check plugin_classloaders_live (plugin_classloaders_registered_total minus plugin_classloaders_reclaimed_total staying above zero is the retention) and jvm_classes_unloaded_classes_total."

      # LOG_VOLUME_TIERING Phase 4 / AD-25(4). Track 2 (`AsyncDetail`) ships
      # blocking = false, so a full queue DROPS log events at every level — INFO and
      # WARN included — and log4j2 reports that only through DefaultErrorHandler:
      # three stderr lines, then one per five minutes, with no count, into the capped
      # docker json-file. Track 2 is now the sole home of wire-level forensics, so a
      # silently lossy detail file is the exact failure the evidence design exists to
      # prevent. This rule is what makes it visible; AsyncQueueMetrics publishes the
      # gauges. It also covers track 1's opposite pathology for free: AsyncRolling is
      # blocking = true, so its queue filling means BOT THREADS PARKED on a queue put.
      # Ratio rather than an absolute, because the two buffers differ (8,192 vs 16,384)
      # and a hard-coded number would silently stop matching if either is retuned.
      # Fleet-wide JVM fact with no owning product, so audience: internal.
      #
      # THREE WAYS TO MISREAD THIS RULE — all of them read a quiet signal as a healthy
      # one, which is the direction that loses evidence:
      #  1. SILENCE IS NOT PROOF OF A LOSSLESS WINDOW. `for: 5m` over a gauge read at
      #     scrape time needs the ratio under 0.1 at EVERY evaluation. A queue that
      #     oscillates — fills on a GC pause or an fsync stall, drains in a few hundred
      #     ms, refills — drops thousands of events per cycle while being observed under
      #     10% at maybe one scrape in ten. This rule stays silent and
      #     log4j2_async_queue_full_samples_total stays at 0. Those counters are lower
      #     bounds; a quiet one does not mean detail.log is whole.
      #  2. THE COUNTERS FREEZE UNDER JOINT SATURATION. AsyncQueueMetrics reports a full
      #     queue by logging a WARN, which routes to AsyncRolling (blocking = true). The
      #     usual cause of a saturated AsyncDetail is a stalling disk, which fills BOTH
      #     queues, so the 10 s sampler can park inside its own WARN and stop advancing
      #     pressure_samples_total / full_samples_total for the worst of the incident.
      #     The gauges keep working (the scrape thread reads the queue directly) and are
      #     the signal of record there.
      #  3. "THE APPENDER IS GONE" READS AS PERFECT HEALTH. Both gauges report -1 when
      #     the appender is not in the running configuration, and -1 / -1 = 1 — the
      #     healthiest possible value here, so nothing alerts on the one failure that
      #     costs the whole forensic tier (wrong config bind-mounted, in-jar fallback
      #     active). ShippedLog4j2ConfigRoutingTest catches it at build time; at runtime,
      #     check `log4j2_async_queue_capacity < 0` by hand before concluding a quiet
      #     AsyncDetail is a healthy one.
      - alert: LogQueueSaturated
        expr: log4j2_async_queue_remaining / log4j2_async_queue_capacity < 0.1
        for: 5m
        labels:
          job: bot-manager
          severity: warning
          audience: internal
        annotations:
          summary: "log4j2 async queue {{ $labels.appender }} is {{ $value | humanizePercentage }} free"
          description: "The async logging queue has been near-full for 5 minutes. On AsyncDetail this means logs/detail/detail.log is missing events at every level for this window — treat it as incomplete. On AsyncRolling it means bot threads are blocking on the queue instead. Check the write rate (verification P4-6) and consider WSPARSER_LOG_LEVEL=WARN."

  # A4 — the host itself: storage, RAM, CPU. All `audience: internal` (requirement B2):
  # these are the fundamental facts the ops room exists for, they have no owning product,
  # and none of them carries a `public_summary` — there is no customer register for
  # "the box is out of disk".
  #
  # Every series here comes from the node-exporter container (job `node`), NOT from
  # actuator (AD-V11). The decisive reason is the 2026-06-30 outage: a disk-full event
  # kills the app, so an app-sourced disk metric goes dark exactly when it matters.
  # Actuator's disk_free_bytes stays enabled as a free JVM-side cross-check; deliberately
  # no rule binds to it.
  #
  # THRESHOLDS ARE FIRST GUESSES, like the ones above — 15%/7% free, 10% available RAM,
  # 90% CPU, and every `for:` window were chosen from the shape of the 2026-06-30 outage
  # and the box's known size, not from measured growth rates. Tune once they have run
  # against the real host for a few days.
  - name: host
    rules:
      # The rule this whole phase was bought by. On 2026-06-30 Loki ran with no retention,
      # filled Bot-1's disk, and ENOSPC-killed Mongo — taking bot-manager AND the whole
      # observability stack down with it, because they are one compose project on one box.
      # So this must fire with enough headroom to actually act on (delete a volume, prune
      # images), not at 99% when the box is already unrecoverable-by-ssh.
      #
      # Stated as free fraction because that is what node-exporter reports directly; the
      # user's framing is occupancy, so read 0.15 free as 85% occupied.
      #
      # mountpoint="/" is the point of the selector, not decoration. node-exporter emits a
      # node_filesystem_* series per mount, and on a Docker host most of those are tmpfs
      # and per-container overlay mounts that are irrelevant, tiny, and permanently near
      # full — alerting across all of them would be pure noise. `/` is the filesystem that
      # filled. The fstype exclusion is belt-and-braces for a host that reports `/` oddly.
      #
      # The SAME selector appears on both sides of the division on purpose: `/` matches on
      # the full label set (device, fstype, mountpoint, instance, job), so an asymmetric
      # selector pairs series for reasons that have nothing to do with the threshold, and
      # a non-pairing side yields no result at all rather than an error.
      #
      # Release-time check (plan Phase 0 Q2, still open): confirm on Bot-1 that this series
      # exists and that node_filesystem_size_bytes{mountpoint="/"} agrees with `df -h /`.
      # A missing result means --path.rootfs / pid:host are wrong and this rule is blind.
      - alert: HostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
          < 0.15
        for: 10m
        labels:
          severity: warning
          audience: internal
        annotations:
          summary: "Host disk {{ $value | humanizePercentage }} free on {{ $labels.instance }}"
          description: "Check the Loki volume and Docker image/container layers first — that is what filled it on 2026-06-30 (`docker system df`, then the loki-data volume). Loki retention and the json-file log caps are the permanent fix; freeing space is the immediate one."

      # Same expression, one threshold down. Inhibited-over in alertmanager.yml so the ops
      # room hears one disk message, not two with different percentages.
      - alert: HostDiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
          < 0.07
        for: 5m
        labels:
          severity: critical
          audience: internal
        annotations:
          summary: "Host disk {{ $value | humanizePercentage }} free on {{ $labels.instance }} — Mongo will be killed on ENOSPC"
          description: "This is the 2026-06-30 state. Mongo dies first and takes the bot fleet's persistence with it. Free space NOW: `docker system prune`, then the loki-data volume."

      # MemAvailable, not MemFree: MemFree counts page cache as used and would sit near
      # zero on any healthy long-running box. Both operands are single series carrying the
      # identical label set (instance, job), so the division pairs one-to-one.
      - alert: HostMemoryLow
        expr: |
          node_memory_MemAvailable_bytes
          / node_memory_MemTotal_bytes
          < 0.10
        for: 10m
        labels:
          severity: warning
          audience: internal
        annotations:
          summary: "Host memory {{ $value | humanizePercentage }} available on {{ $labels.instance }}"
          description: "The JVM is the largest tenant on this box; a bot fleet ramp or a thread leak shows up here before the OOM killer picks a victim. Check jvm_memory_used_bytes and jvm_threads_live_threads alongside this."

      # 1 - idle, averaged across cores. `avg by (instance)` collapses the per-cpu series;
      # `1 - <vector>` is scalar-vector arithmetic, which drops the metric name and keeps
      # `instance`, so $value is a fraction of total capacity across all cores.
      #
      # 15m, and 0.90 not 0.80: a bot fleet ramp legitimately pins this box for minutes at
      # a time. This is meant to catch a runaway (reconnect storm, GC death spiral), not
      # honest work.
      - alert: HostCpuHigh
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
          audience: internal
        annotations:
          summary: "Host CPU at {{ $value | humanizePercentage }} on {{ $labels.instance }} for 15 minutes"
          description: "Sustained saturation. Distinguish an honest fleet ramp from a runaway: check bots_managed against reconnect churn and GC time before restarting anything."

      # Without this, the three rules above fail silent — no node-exporter means no series,
      # and a rule with no series never fires. Note BotManagerDown does NOT inhibit this
      # (its inhibit matches `equal: ['job']`, and this is job="node"), which is correct:
      # when the app is down, "the host is also blind" is exactly what an operator needs
      # to know, not something to suppress.
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: warning
          audience: internal
        annotations:
          summary: "node-exporter is not scrapeable — host CPU/RAM/disk alerting is blind"
          description: "HostDiskSpaceLow/Critical, HostMemoryLow and HostCpuHigh cannot fire while this is firing. Check `docker compose ps node-exporter`; if the host itself is dying, this may be the only warning you get."
