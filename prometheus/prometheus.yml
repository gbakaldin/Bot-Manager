# Prometheus scrape config for the Bot Manager observability pipeline.
#
# Bind-mounted into the prometheus container at /etc/prometheus/prometheus.yml
# (see docker-compose.yml). Editable on the host without root, matching the
# ./logs and ./grafana/provisioning patterns.
#
# Two scrape targets: bot-manager's actuator endpoint (Micrometer exposes every
# bot-side counter/gauge under it, so this file does not change when meters are
# added) and node-exporter for host CPU / RAM / disk.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules, evaluated every `evaluation_interval`. Bind-mounted alongside
# this file (see docker-compose.yml). VIPTALK_ALERTING Phase 3.
rule_files:
  - /etc/prometheus/alerts.yml

# Firing alerts are handed to Alertmanager, which does the grouping, dedup and
# repeat handling, then webhooks bot-manager, which routes to a VipTalk room.
# Compose service name + container-internal port.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: bot-manager
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          # Compose service name + container-internal port. bot-manager listens
          # on 8085 inside the container (see application.properties:server.port);
          # the host's 8080 mapping in docker-compose.yml is not used here.
          - bot-manager:8085

  # Host CPU / RAM / filesystem, from the node-exporter container (VIPTALK_ALERTING_V2
  # Phase 5 / AD-V11). Deliberately a SEPARATE job from bot-manager: when the app dies —
  # e.g. because the disk filled, the 2026-06-30 failure — this target keeps answering,
  # which is the whole reason the host rules are not built on actuator's disk metrics.
  # The job name is load-bearing: `up{job="node"}` is what NodeExporterDown watches, and
  # Alertmanager's BotManagerDown inhibit matches on `equal: ['job']`, so host alerts are
  # correctly NOT suppressed while the app is down.
  - job_name: node
    static_configs:
      # Compose service name + container-internal port; node-exporter has no host port
      # mapping, matching the alertmanager posture.
      - targets:
          - node-exporter:9100
