# Custom Loki config (RESILIENCE_HARDENING P0c).
#
# Overriding -config.file drops the image's bundled /etc/loki/local-config.yaml,
# so the server/common/schema blocks below are restated verbatim from the 3.3.2
# default to preserve the existing on-disk data layout (loki-data volume at
# /loki). The only additions are the limits_config retention block (period +
# per-stream overrides) and the compactor retention block, so the loki-data
# volume can no longer grow unbounded (it hit 33.7 GB and ENOSPC-killed the
# whole stack on 2026-06-30).

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retention is level-aware (LOG_VOLUME_TIERING AD-6). `retention_period` is the
# default for every stream that matches no selector below — i.e. INFO, the tier
# that has to stay queryable for weeks — and is raised 168h -> 720h (30 d).
# `retention_stream` then splits the two extremes: WARN/ERROR are cheap and are
# the ones an incident is reconstructed from, so they also get 30 d; DEBUG/TRACE
# are 46–124 GB/day at fleet scale and are only ever read within minutes of the
# event, so they get 24 h.
#
# These selectors only work because `level` is promoted to a Loki LABEL by
# promtail-config.yml's `labels` stage. Remove that stage and the split silently
# degrades to the global period — it does not error.
#
# Retention is enforced by the compactor on its compaction_interval (10 m) and
# after retention_delete_delay (2 h), so do not expect same-minute deletion when
# verifying.
#
# PHASE 4 RE-EXAMINED THESE NUMBERS AND CHANGED NONE OF THEM (AD-29). What changed
# is what reaches Loki at all: since the two-track split, promtail ingests ONLY
# track 1 (logs/console.log), which is capped at INFO+ by a ThresholdFilter on the
# AsyncRolling appender. Track 2 (logs/detail/detail.log) carries the ws-parser
# library and every DEBUG/TRACE line and is never scraped.
#
#   * 720h stays, and is now cheap. The 1.016 GB measured at a 168 h horizon was
#     ~99% ws-parser and DEBUG; what remains projects to roughly 7 MB/day at
#     staging scale and ~2 GB at a 30-day steady state even allowing 10x for a
#     busier fleet, against 66.96 GiB free on Bot-1. P0-9's "abort if the 30-day
#     projection exceeds 50% of available disk" gate is unchanged and still
#     governs -- a projection is still a projection.
#   * The {level=~"DEBUG|TRACE"} selector below now matches NOTHING, and that is
#     precisely why it stays: it is a TRIPWIRE, not an active policy. The only
#     ways a DEBUG line can reach Loki now are someone removing the
#     ThresholdFilter or repointing promtail at logs/detail/ -- both silent, and
#     both would otherwise dump the highest-volume tier in the system into a 720 h
#     horizon. This selector degrades that to 24 h. It costs nothing to keep.
#   * It is also the switch AD-24's costed exception would need: shipping
#     com.vingame.bot DEBUG to Loki at 24 h is one line in the bind-mounted
#     log4j2.properties (`appender.async.filter.threshold.level = debug`) plus
#     BOT_LOG_LEVEL=INFO on staging, and nothing here would have to change.
limits_config:
  retention_period: 720h
  retention_stream:
    - selector: '{level=~"WARN|ERROR"}'
      priority: 1
      period: 720h
    - selector: '{level=~"DEBUG|TRACE"}'
      priority: 1
      period: 24h

# The compactor is what actually enforces retention for the tsdb/filesystem
# store. delete_request_store is mandatory in Loki 3.x once retention_enabled is
# true, or the server refuses to start.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

ruler:
  alertmanager_url: http://localhost:9093
