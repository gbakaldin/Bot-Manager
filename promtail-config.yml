server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # MUST be inside a volume (LOG_VOLUME_TIERING Phase 4b / AD-31). This used to be
  # /tmp/positions.yaml, and nothing mounted /tmp: every `docker compose down`
  # discarded the read offsets, so promtail re-read all ~12 retained
  # console-*.log archives from byte 0 on the next start. Measured after one
  # deploy: loki-data 1.02 GB -> 3.24 GB in 17 minutes, with Loki logging both
  # `timestamp too old` rejections and accepted duplicates. Under the 720 h
  # retention horizon that garbage now persists 4.3x longer, and it invalidates
  # P0-9's growth measurement outright.
  #
  # /tmp is deliberately NOT what gets mounted -- shadowing a container's /tmp is
  # a wider blast radius than the problem warrants. The `promtail-positions`
  # named volume in docker-compose.yml is mounted here and nowhere else.
  # LogRetentionPipelineTest fails the build if this directory stops being a
  # mount target on the promtail service.
  filename: /promtail-positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bot-manager
    static_configs:
      - targets:
          - localhost
        labels:
          job: bot-manager
          __path__: /logs/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            botGroupId: botGroupId
            environmentId: environmentId
            gameType: gameType
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z0700"
      # `level` MUST stay a label: loki-config.yaml's retention_stream selectors
      # match on it, and they degrade silently to the global period if it is
      # demoted back to a plain field (LOG_VOLUME_TIERING AD-6).
      - labels:
          level:
          botGroupId:
          environmentId:
          gameType:
      # Committed but DISABLED on purpose (LOG_VOLUME_TIERING AD-6). Dropping
      # DEBUG/TRACE at ingest is the cheapest possible control, but it would also
      # make Phase 2's scoped per-group DEBUG invisible in Grafana — which is the
      # entire point of Phase 2. Loki's 24 h per-stream retention for
      # {level=~"DEBUG|TRACE"} is the primary control instead. Uncomment ONLY on
      # an instance that is provably drowning, and expect to lose scoped-debug
      # visibility there.
#      - match:
#          selector: '{level=~"DEBUG|TRACE"}'
#          action: drop
