# Alertmanager configuration for the Bot Manager alerting pipeline.
#
# Bind-mounted into the alertmanager container at /etc/alertmanager/alertmanager.yml
# (see docker-compose.yml), editable on the host without root.
#
# The default receiver is a webhook into bot-manager, which resolves the target
# VipTalk room per alert from the rule's `audience` label — ops room for
# `internal`, the product's room for `product`, both (in two registers) for
# `both` — and posts the message. The product itself comes from the `product`
# label, else from the `environmentId` label via Mongo. See
# docs/plans/VIPTALK_ALERTING.md and VIPTALK_ALERTING_V2.md (AD-V3).
#
# There is one exception, and it is the reason for the second receiver below:
# BotManagerDown fires precisely when bot-manager is unscrapeable, i.e. when the
# receiver above is dead. The message about the app being down cannot be delivered
# by the app, so it also goes to `viptalk-static-down`, a shim container that posts
# to VipTalk directly (VIPTALK_ALERTING_V2 AD-V8b / AD-V9, Phase 6).
#
# NO SECRETS LIVE HERE. Both receivers are in-network compose service names; the
# VipTalk token is the shim container's environment variable, from secrets.env.
# That is what lets this file stay plain and committed rather than being rendered
# from a template at deploy time.
#
# Grouping, dedup and repeat live HERE, not in the app (VIPTALK_ALERTING AD-6) —
# that is the whole reason for putting Alertmanager in front of the bot rather than
# calling the VipTalk API from app code on every event.

route:
  receiver: viptalk

  # One notification per (alertname, product, environmentId, audience) tuple.
  # bot-manager batches everything in a group that shares a room into a single
  # message, so grouping here directly controls message volume in the rooms.
  # `audience` is constant per rule, so adding it changes no grouping today — it
  # is defensive: grouping must never merge two registers (an internal alert and
  # a customer-facing one) into a single message (VIPTALK_ALERTING_V2 AD-V3).
  group_by: ['alertname', 'product', 'environmentId', 'audience']

  # Wait this long after the first alert in a new group before notifying, so a
  # burst that fires together arrives as one message.
  group_wait: 30s
  # Wait this long before notifying about new alerts added to an existing group.
  group_interval: 5m
  # Re-send a still-firing group this often. 4h is deliberately slow: these rooms
  # are shared with people who are not on call for the bot fleet.
  repeat_interval: 4h

  # BotManagerDown goes to BOTH receivers (AD-V9): the shim delivers the outage
  # notice while the app is dead, and the app delivers the recovery notice, which
  # by definition it can, because the app being back is what resolves this alert.
  #
  # TWO sibling routes for one alertname, which looks redundant and is not. A child
  # route that matches CONSUMES the alert: `continue: true` continues to the next
  # SIBLING, not to the parent's own receiver. So with only the first route here,
  # BotManagerDown would reach the shim and never reach bot-manager — no recovery
  # message would ever be sent, which is exactly the half AD-V9 is about. (The plan's
  # draft of this block had that shape; it is a routing-semantics bug, not a typo.)
  # The second route has no `continue`, so matching stops there.
  # The same semantics govern the `evidence` receiver added below
  # (LOG_VOLUME_TIERING Phase 3): it promotes the log files around an incident out
  # of the normal retention sweep, so it must be an ADDITIONAL destination, never a
  # replacement for the VipTalk delivery of the alert that triggered it. Every
  # `evidence` route therefore carries `continue: true`, and every alertname routed
  # to it has a trailing sibling sending it to `viptalk` — otherwise the evidence
  # route would consume the alert and silently stop it reaching the rooms. That is
  # the same bug described above, one phase later.
  #
  # Routes are matched in order, so the shape is: evidence first (continue), then
  # the existing delivery routes, then a terminal viptalk sibling.
  routes:
    - matchers:
        - alertname = "BotManagerDown"
      receiver: evidence
      continue: true
    - matchers:
        - alertname = "BotManagerDown"
      receiver: viptalk-static-down
      continue: true
    - matchers:
        - alertname = "BotManagerDown"
      receiver: viptalk

    # The logs explaining why a group died are the ones a cheap retention is most
    # likely to have swept by the time anyone looks. Hence evidence, plus the
    # MANDATORY viptalk sibling.
    #
    # This pair matters MORE since DEAD_GROUP_AUTO_RECOVERY, not less: a group that
    # recovers by itself resolves this alert without a human ever opening the box, so
    # the pinned files are now sometimes the only record that anything happened. It is
    # also why the two recovery rules (EnvironmentGroupRecoveryExhausted,
    # EnvironmentGroupRecoveryFlapping) get NO route of their own — both can only fire
    # for a group whose death already fired EnvironmentGroupDead and already pinned the
    # window, hours earlier, and a route here that promoted again would pin the
    # post-incident tail instead of the incident. With no matching child they fall
    # through to the parent `viptalk` receiver, which is the delivery every ordinary
    # alert gets; AlertmanagerRoutingTest.everyAlertRuleStillReachesVipTalk enumerates
    # prometheus/alerts.yml and proves it for them without anyone editing this file.
    - matchers:
        - alertname = "EnvironmentGroupDead"
      receiver: evidence
      continue: true
    - matchers:
        - alertname = "EnvironmentGroupDead"
      receiver: viptalk

receivers:
  - name: viptalk
    webhook_configs:
      # Compose service name + container-internal port (bot-manager listens on 8085
      # inside the container; the host's 8080 mapping is not used on this network).
      - url: http://bot-manager:8085/api/v1/alerts/alertmanager
        # Send the RESOLVED half too — an alert that clears without a follow-up
        # message leaves the room believing the fleet is still broken.
        send_resolved: true
        # bot-manager answers 502 when VipTalk did not accept the message, which is
        # what makes this retry meaningful (VIPTALK_ALERTING AD-8).
        max_alerts: 0

  # The out-of-band hop. Reached only by the BotManagerDown route above.
  - name: viptalk-static-down
    webhook_configs:
      - url: http://viptalk-shim:8080/alertmanager
        # send_resolved: false — the shim's text is a fixed string held in the
        # container and cannot say "recovered"; publishing it on recovery would put
        # "the application is experiencing issues" in a room at the moment the
        # incident ended. The recovery half comes from the `viptalk` receiver above
        # (AD-V9). The shim also refuses a payload marked resolved, so this line and
        # the shim agree rather than one trusting the other.
        send_resolved: false
        # Same posture as the app receiver: the shim answers 502 when VipTalk did not
        # accept the message, so a retry is meaningful.
        max_alerts: 0

  # Retention promotion, not delivery: this receiver sends nothing to anybody. It
  # tells evidence-shim to hardlink the log files around the incident into
  # logs/evidence/, where neither log4j2's Delete nor Loki's retention can reach
  # them (LOG_VOLUME_TIERING Phase 3 / AD-13). Every route pointing here carries
  # `continue: true` and has a viptalk sibling — see the routing comment above.
  - name: evidence
    webhook_configs:
      - url: http://evidence-shim:8080/alertmanager
        # send_resolved: false — there is nothing to preserve about a recovery, and
        # promoting on it would pin post-incident noise instead of the incident. The
        # shim also ignores a payload marked resolved, so this line and the shim
        # agree rather than one trusting the other.
        send_resolved: false
        max_alerts: 0

inhibit_rules:
  # When bot-manager itself is down, every gauge it produces goes stale and its alerts
  # are noise on top of the real problem. Suppress them while BotManagerDown is firing.
  #
  # `equal: ['job']` is what keeps the host rules (job="node") visible — a dead app is
  # no reason to stop hearing that the disk is full, and the disk being full is often
  # WHY the app is dead. But it only works if every app-scoped alert actually carries
  # `job`, and Phase 3's `sum by (product, environmentId)` clauses DROP it: aggregation
  # keeps only the labels named. That silently un-inhibited EnvironmentAuthDown,
  # EnvironmentLoginFailing, EnvironmentDeadBotRatioHigh and GameNoRounds while leaving
  # their bare-gauge siblings inhibited — a split nothing in the design intended.
  #
  # So every rule in the `bot-manager-*` groups now declares `job: bot-manager` as a
  # static label, which survives any aggregation because it is stamped on the alert
  # rather than carried from the series. `AlertRulesAudienceTest` fails the build if one
  # forgets it, or if a `host` rule adopts it — the same file-level-contract argument as
  # the `audience` label.
  - source_matchers:
      - alertname = "BotManagerDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ['job']

  # EnvironmentSocketDown (< 50%) and EnvironmentSocketDegraded (< 80%) overlap by
  # construction — every outage satisfies both. Suppress the warning while the
  # critical is firing for the same environment, so a product room gets one message
  # about one condition rather than two with different percentages.
  - source_matchers:
      - alertname = "EnvironmentSocketDown"
    target_matchers:
      - alertname = "EnvironmentSocketDegraded"
    equal: ['product', 'environmentId']

  # Same construction, same fix, for the host disk pair: HostDiskSpaceCritical (< 7%
  # free) can never fire without HostDiskSpaceLow (< 15%) also firing, and two messages
  # quoting two percentages of one filesystem is worse than one. Matched on the
  # filesystem, not just the host, so a second mount filling still gets its own message.
  - source_matchers:
      - alertname = "HostDiskSpaceCritical"
    target_matchers:
      - alertname = "HostDiskSpaceLow"
    equal: ['instance', 'mountpoint']
