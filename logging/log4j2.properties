# =============================================================================
# MOUNTED COPY. Bind-mounted read-only at /app/config/log4j2.properties and
# selected by LOGGING_CONFIG (docker-compose.yml, LOG_VOLUME_TIERING AD-2) --
# the same posture as prometheus.yml / alerts.yml / alertmanager.yml. Its twin
# is bot-app/src/main/resources/log4j2.properties, the in-jar fallback.
# KEEP THE TWO IN SYNC -- every change below must be applied to both files;
# below this header they are byte-identical.
#
# This copy is what makes a level or retention change a `docker compose restart`
# on the box instead of a rebuild + redeploy of the whole bot fleet. Editing it
# does NOT require a new image. If this file (or the mount) goes missing the app
# falls back to the in-jar copy only when LOGGING_CONFIG is unset or empty --
# with LOGGING_CONFIG pointing at a path that does not exist, Spring Boot fails
# startup loudly rather than running blind.
# =============================================================================

# Root logger configuration
rootLogger.level = info
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.async.ref = AsyncRolling

# Logger for application package.
#
# The shipped default is INFO (LOG_VOLUME_TIERING Phase 1, AD-7). DEBUG here was
# baked into the jar and projected to 46-124 GB/day at 20-30k bots; INFO is now
# the cheap, correct floor and per-bot detail is opt-in.
#
# Override WITHOUT editing this file: set LOGGING_LEVEL_COM_VINGAME_BOT (compose
# passes ${BOT_LOG_LEVEL:-INFO}). Spring Boot's Log4J2LoggingSystem applies
# `logging.level.*` AFTER this file is read and, because a LoggerConfig named
# exactly `com.vingame.bot` exists below, it mutates that config in place --
# additivity = false and BOTH appenderRefs survive. Verified in the build by
# LoggingLevelOverrideTest; do not rename this logger or that override silently
# starts creating a fresh LoggerConfig with no appenders instead.
#
# Staging sets BOT_LOG_LEVEL=DEBUG in secrets.env/.env. /actuator/loggers still
# works and is still GLOBAL -- at 10 prod environments that is a ~5 GB/hour action.
logger.app.name = com.vingame.bot
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRef.console.ref = ConsoleAppender
logger.app.appenderRef.async.ref = AsyncRolling

# Console appender - human-readable with MDC context
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %c{1} [%X{botGroupId}/%X{botId}/%X{gameType}] - %msg%n
# Cap the console at INFO+ (AD-5). Every line used to be serialized and written
# twice: once as a pattern line to stdout (-> docker json-file, capped 50m x 5)
# and once as JSON to the rolling file. `docker logs` stays useful (INFO and all
# WARN/ERROR still appear) while DEBUG/TRACE go to the JSON file only, halving
# the cost of exactly the tier we are trying to make survivable.
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = info
appender.console.filter.threshold.onMatch = NEUTRAL
appender.console.filter.threshold.onMismatch = DENY

# Rolling file appender - JSON structured for Promtail/Loki
appender.rolling.type = RollingFile
appender.rolling.name = RollingFileAppender
appender.rolling.fileName = /app/logs/console.log
appender.rolling.filePattern = /app/logs/console-%d{yyyy-MM-dd-HH}.log
appender.rolling.layout.type = JsonTemplateLayout
appender.rolling.layout.eventTemplateUri = classpath:log4j2-json-template.json

# Async wrapper for the rolling file appender (AD-3). Both appends used to happen
# on the calling bot thread; logging must never add latency to a bot thread.
# AsyncAppender is stdlib log4j-core -- full async loggers would need
# com.lmax:disruptor, which is not on the classpath and would make this a pom
# change rather than a config change.
#
# GOTCHA: in the properties format a nested AppenderRef *inside an appender*
# requires the explicit `.type = AppenderRef` line below (unlike a logger's
# appenderRef). On log4j-core 2.24.1 omitting it throws
# "ConfigurationException: No type attribute provided for component appenderRef"
# at context start, i.e. the JVM never gets a logger — verified, not theoretical.
appender.async.type = Async
appender.async.name = AsyncRolling
appender.async.appenderRef.type = AppenderRef
appender.async.appenderRef.ref = RollingFileAppender
appender.async.bufferSize = 8192
# blocking = true is REQUIRED for the discard policy in log4j2.component.properties
# to take effect, and therefore for AD-4 to hold. AsyncAppender.append() only
# consults asyncQueueFullPolicy when blocking is true; with blocking = false it
# drops the event at EVERY level (ERROR included) and just writes to the status
# logger. With blocking = true + Discard/discardThreshold=DEBUG, a full queue
# discards DEBUG/TRACE and blocks only for INFO+, which is the stated intent.
# See LOG_VOLUME_TIERING AD-4 (the AD-3 snippet's `blocking = false` contradicts it).
appender.async.blocking = true

# Trigger rollover every 2 hours (AD-20). Fewer boundaries, and a longer window
# of pre-incident context for Phase 3's "newest two" promotion. modulate = true
# keeps boundaries on even hours, so %d{yyyy-MM-dd-HH} names stay unique.
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 2
appender.rolling.policies.time.modulate = true

# Delete files older than 7 days OR if total size > 10GB.
# Deliberately unchanged (Phase 0 step 5): these caps are the thing standing
# between us and a repeat of 2026-06-30. Raise `age` to 14d only after the disk
# size is established (Verification P0-6).
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 200
appender.rolling.strategy.delete.type = Delete
appender.rolling.strategy.delete.basePath = /app/logs
appender.rolling.strategy.delete.maxDepth = 1
appender.rolling.strategy.delete.ifFileName.type = IfFileName
appender.rolling.strategy.delete.ifFileName.glob = console-*.log
appender.rolling.strategy.delete.ifAny.type = IfAny
appender.rolling.strategy.delete.ifAny.ifLastModified.type = IfLastModified
appender.rolling.strategy.delete.ifAny.ifLastModified.age = 7d
appender.rolling.strategy.delete.ifAny.ifAccumulatedFileSize.type = IfAccumulatedFileSize
appender.rolling.strategy.delete.ifAny.ifAccumulatedFileSize.exceeds = 10GB
