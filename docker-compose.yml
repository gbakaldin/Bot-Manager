# Shared json-file log-rotation policy. Applied to every service so a container's
# stdout/stderr log can never grow unbounded on the host filesystem — the missing
# guard that let container logs (alongside the Loki volume) fill Bot-1's disk on
# 2026-06-30. 50 MB × 5 files = 250 MB hard cap per container.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./seed.js:/seed.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot-manager:
    image: vingame-bot:latest
    user: "${HOST_UID}:${HOST_GID}"
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8080:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/botmanager
      # VipTalk alerting (VIPTALK_ALERTING AD-2). Values come from ./secrets.env,
      # which deploy.sh merges into the generated .env — the token must never be
      # baked into the image or committed. All default to the disabled posture,
      # so a host without secrets.env deploys exactly as before.
      - VIPTALK_ENABLED=${VIPTALK_ENABLED:-false}
      - VIPTALK_BOT_TOKEN=${VIPTALK_BOT_TOKEN:-}
      - VIPTALK_OPS_ROOM_ID=${VIPTALK_OPS_ROOM_ID:-}
      # No `staging` default on purpose: the label is the only thing distinguishing the
      # three instances in a shared room (AD-V15), so a forgotten override on the prod box
      # must render as "unlabelled" (and a startup WARN), not as a confident lie.
      - VIPTALK_INSTANCE_LABEL=${VIPTALK_INSTANCE_LABEL:-}
      # Customer-facing register for `audience: both` alerts (VIPTALK_ALERTING_V2 AD-V7).
      # Default false: only the prod instance may write non-technical notices into a
      # product room.
      - VIPTALK_CUSTOMER_NOTICES_ENABLED=${VIPTALK_CUSTOMER_NOTICES_ENABLED:-false}
      # Recovery copy for the RESOLVED half of an `audience: both` alert. Empty is safe —
      # it falls back to the built-in default rather than muting recovery notices.
      - VIPTALK_PUBLIC_RESOLVED_SUMMARY=${VIPTALK_PUBLIC_RESOLVED_SUMMARY:-}
    depends_on:
      mongo:
        condition: service_healthy
    extra_hosts:
      - "gamems.dev:10.30.1.104"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-data:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./logs:/logs:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Overridable via .env / host env; falls back to the legacy default so
      # staging login is unchanged. Set GRAFANA_ADMIN_PASSWORD before a prod deploy.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - prometheus

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9090:9090"
    # Specifying `command:` overrides the image's default command entirely, so
    # the two Prometheus defaults must be restated alongside the retention flag
    # or config loading / TSDB path break. See METRICS_API.md AD-1.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      # Bind-mounted config so sgame can edit without root, matching the
      # ./logs and ./grafana/provisioning patterns. See
      # docs/plans/OBSERVABILITY.md Architecture Decision 9.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alerting rules, referenced from prometheus.yml's rule_files. Same bind-mount
      # rationale — edited on the host, no image rebuild. VIPTALK_ALERTING Phase 3.
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Named volume for the TSDB. Prometheus is sensitive to host filesystem
      # semantics; the operator does not need to inspect tsdb files directly.
      - prometheus-data:/prometheus
    depends_on:
      - bot-manager

  # Groups / dedups / repeats firing alerts and webhooks them into bot-manager,
  # which routes each to the VipTalk room of the product it concerns.
  # See docs/plans/VIPTALK_ALERTING.md. Not exposed on the host by default — it is
  # internal infrastructure like Prometheus; uncomment the port to reach its UI.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    logging: *default-logging
    # ports:
    #   - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Notification/silence state, so a restart does not re-send everything that
      # is still firing.
      - alertmanager-data:/alertmanager
    depends_on:
      - bot-manager

  # The out-of-band delivery hop for BotManagerDown (VIPTALK_ALERTING_V2 Phase 6 /
  # AD-V8b). Alertmanager webhooks it, it POSTs straight to VipTalk.
  #
  # Why a second container rather than a second code path in bot-manager: BotManagerDown
  # fires precisely when bot-manager is unscrapeable, and bot-manager is what forwards
  # alerts to VipTalk. The message about the app being down therefore cannot be delivered
  # by the app. This service shares nothing with it — no code, no Mongo, no JVM — so it
  # keeps working when the app is gone. It deliberately has NO `depends_on: bot-manager`
  # for the same reason.
  #
  # A stock python image with the script bind-mounted, not a built image: the shim is
  # stdlib-only (Phase 0 proved VipTalk accepts a JSON body, so it is a field remap and
  # needs no libraries), and deploy.sh only runs `docker compose up` — an image that
  # needed building would be one more thing to get wrong on the box. Same bind-mount
  # posture as prometheus.yml / alerts.yml / alertmanager.yml. The patch version is left
  # floating on purpose: no dependency of ours pins it.
  #
  # It runs on EVERY instance, not just prod, and self-disables on blank config. The plan
  # said "not started when VIPTALK_DOWN_ROOM_IDS is empty", but the receiver pointing here
  # lives in the committed alertmanager.yml, so an absent container would leave Alertmanager
  # retrying a connection-refused webhook during an outage. Instead the customer register
  # is empty off prod (that is what AD-V7 actually asks for) while the technical register
  # still delivers "staging bot-manager is down" to the ops room, which is useful.
  viptalk-shim:
    image: python:3.12-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-u", "/app/shim.py"]
    environment:
      # Same token and same ops room as bot-manager, from the same secrets.env entries —
      # config for a second delivery path, not a second source of truth (AD-V14).
      #
      # The master switch and the customer-copy switch reach BOTH paths. Without these
      # two lines VIPTALK_ENABLED=false silenced the app and left this container armed,
      # so the next BotManagerDown still published — including customer-facing copy into
      # a live product room, which is the single most sensitive message in the system
      # escaping the switch documented to stop it. Default true: an unset variable must
      # not silence the out-of-band path (the app's own default is false, deliberately
      # the other way round — see shim.py).
      - VIPTALK_ENABLED=${VIPTALK_ENABLED:-true}
      - VIPTALK_CUSTOMER_NOTICES_ENABLED=${VIPTALK_CUSTOMER_NOTICES_ENABLED:-true}
      - VIPTALK_BOT_TOKEN=${VIPTALK_BOT_TOKEN:-}
      - VIPTALK_OPS_ROOM_ID=${VIPTALK_OPS_ROOM_ID:-}
      # Product rooms for the customer register. Empty off prod (AD-V7) ⇒ the shim
      # delivers only the technical register there.
      - VIPTALK_DOWN_ROOM_IDS=${VIPTALK_DOWN_ROOM_IDS:-}
      # Stamped into both texts. Three instances share the ops room and this is the only
      # thing telling them apart (AD-7 / AD-V15); blank ⇒ no segment, never a guess.
      - VIPTALK_INSTANCE_LABEL=${VIPTALK_INSTANCE_LABEL:-}
      # Optional wording overrides. Blank ⇒ the built-in copy, which is kept in step with
      # BotManagerDown's public_summary in prometheus/alerts.yml.
      - VIPTALK_DOWN_TEXT=${VIPTALK_DOWN_TEXT:-}
      - VIPTALK_DOWN_OPS_TEXT=${VIPTALK_DOWN_OPS_TEXT:-}
      - VIPTALK_BASE_URL=${VIPTALK_BASE_URL:-https://api.viptalk.org}
      # The script mount is read-only; without this python warns on every start trying to
      # write __pycache__ next to it.
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./viptalk-shim/shim.py:/app/shim.py:ro
    # /health reports the resolved config with the token masked — how the delivery path is
    # checked without waiting for (or staging) an outage.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Host CPU / RAM / filesystem metrics, scraped by Prometheus as job `node`.
  # VIPTALK_ALERTING_V2 Phase 5 / AD-V11.
  #
  # Why a separate container rather than actuator's disk_free_bytes: a disk-full event
  # kills the app, and with it any metric the app produces — which is precisely the
  # 2026-06-30 shape, where Loki's unbounded volume ENOSPC-killed Mongo and took the box
  # down. node-exporter keeps reporting when the JVM is gone, and it is the only source
  # that sees host RAM at all (actuator sees JVM heap). Actuator's disk metrics stay
  # enabled as a free JVM-side cross-check; no rule binds to them.
  #
  # Not exposed on the host, matching the alertmanager posture — Prometheus reaches it
  # over the compose network.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    logging: *default-logging
    # The filesystem collector reads the mount table from /proc/1/mounts, so it needs the
    # host PID namespace to see the HOST's mounts instead of this container's.
    pid: host
    command:
      # Everything the filesystem collector stats is resolved under /host, and the prefix
      # is stripped again before it becomes the `mountpoint` label — so the host root
      # reads back as mountpoint="/", which is what the disk rules select on.
      - "--path.rootfs=/host"
      # Upstream's default exclusion set (dev/proc/sys/run credentials, and per-container
      # overlay mounts under /var/lib/docker, which are noise on a Docker host) plus our
      # own bind target. `$$` is compose's escape for a literal `$`. Restating the
      # defaults is deliberate: naming this flag replaces them wholesale, and dropping
      # `/var/lib/docker/.+` would re-add one series set per container layer.
      - "--collector.filesystem.mount-points-exclude=^/(dev|etc|host|proc|sys|run/credentials/.+|var/lib/docker/.+|var/lib/kubelet/pods/.+)($$|/)"
    volumes:
      # Read-only, and rslave so mounts made on the host after this container starts
      # still propagate in. Needs no privilege beyond what compose already has — there is
      # still no passwordless sudo on Bot-1 and none is required.
      - /:/host:ro,rslave

volumes:
  mongo-data:
  loki-data:
  grafana-data:
  prometheus-data:
  alertmanager-data:
